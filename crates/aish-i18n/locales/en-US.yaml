help:
  labels:
    usage: "Usage"
    options: "Options"
    examples: "Examples"
    notes: "Notes"
    brief_usage: "Usage: {usage}"

  general:
    title: "AI Shell Help"
    markdown: |-
      ## Quick Start
      - **Shell commands** — type directly: `ls`, `cd`, `vim`, `ssh`, `top` ...
      - **Ask AI** — prefix with `;` or `；`: `;how to find large files`
      - **Slash commands** — type `/` on empty line for interactive picker

      ## Slash Commands
      | Command | Description |
      |---------|-------------|
      | `/help [page]` | Show help (`/help` for pages) |
      | `/quit` | Exit AI Shell |
      | `/model [name]` | Show or switch AI model |
      | `/setup` | Reconfigure API settings |
      | `/setting` | Open the interactive settings panel |
      | `/plan [start\|status\|exit]` | Plan mode control |
      | `/token` | Show token usage (last 7 days) |
      | `/resume [id]` | Resume a previous session |
      | `/feedback` | Submit feedback or report a bug |
      | `/record start\|stop` | Record terminal session as asciinema cast |

      ```
      /record start         # Start recording
      /record stop          # Stop and save recording
      ```

      ## Configuration
      - Config file: `~/.config/aish/config.yaml`
      - CLI args > env vars (`AISH_MODEL`, `AISH_API_KEY`, `AISH_API_BASE`) > config file
      - Run `/setup` or `aish setup` for interactive configuration

      ## Session Management
      - `aish -c` — attach to an existing live session (or pick from a list)
      - `Ctrl+Q` — detach the current session (keeps running in background); reconnect with `aish -c`
      - `Ctrl+E` — rename the highlighted session in the picker

      ## Keyboard Shortcuts
      | Key | Action |
      |-----|--------|
      | `Ctrl+C` | Cancel current operation (press twice to exit) |
      | `Ctrl+D` | Exit shell |
      | `Shift+Tab` / `F2` | Toggle plan mode |
      | `Ctrl+O` | Browse output history |
      | `Ctrl+Q` | Detach session (reconnect with `aish -c`) |
      | `Ctrl+E` | Rename session (in picker) |
      | `/` on empty line | Slash command picker |

      ## Help Pages
      Use `/help <page>` for details on aish-specific features:

      | Page | Content |
      |------|---------|
      | `ai` | AI assistant usage (`;` prefix, context, conversation) |
      | `model` | Model management (view, switch, supported providers) |
      | `plan` | Plan mode (workflow, approval, vs normal mode) |
      | `config` | Configuration (files, env vars, priority) |
      | `shortcuts` | Keyboard shortcuts (editing, control, mode switching) |
      | `security` | Security policy (risk levels, rules, secret detection) |

      ## More
      - Security policy: `~/.config/aish/security_policy.yaml`
      - Session data: `~/.local/share/aish/sessions.db`
      - Logs: `~/.config/aish/logs/aish.log`
      - Docs: https://github.com/AI-Shell-Team/aish

  topics:
    unknown: "Unknown help page '{topic}'. Available pages: ai, model, plan, config, shortcuts, security"

    ai:
      title: "AI Assistant"
      markdown: |-
        ## Asking AI

        Prefix your question with `;` (semicolon) or `；` (full-width):

        ```
        ; how do I find large files?
        ; explain this command: ls -la
        ; suggest a better way to compress files
        ```

        The AI sees your conversation context, including previous shell commands and AI responses.

        ## How It Works

        - Your question is sent to the configured LLM model
        - The AI receives conversation history for context
        - Responses are rendered with syntax highlighting and table formatting

        ## Context Management

        - Conversation history is maintained automatically
        - Context auto-compaction triggers when token budget is exceeded
        - Older messages are summarized to keep recent context fresh

    model:
      title: "Model Management"
      markdown: |-
        ## Viewing & Switching Models

        ```
        /model                # Show current model
        /model gpt-4o         # Switch to GPT-4o
        /model claude-sonnet-4-6  # Switch to Claude
        ```

        ## Supported Providers

        | Provider | Model Prefix |
        |----------|-------------|
        | OpenAI | `gpt-*`, `o1-*`, `o3-*`, `o4-*` |
        | Anthropic | `claude-*` |
        | Google | `gemini-*`, `gemma-*` |
        | DeepSeek | `deepseek-*` |
        | Qwen | `qwen-*`, `qwq-*` |
        | Mistral | `mistral-*`, `mixtral-*`, `codestral-*` |
        | xAI | `grok-*` |
        | Moonshot | `kimi-*`, `moonshot-*` |
        | Zhipu | `glm-*` |
        | Local | Ollama, vLLM, local API endpoints |

        ## Switching Behavior

        - Provider is auto-detected from model name
        - Connectivity is validated before switching
        - On failure, the current model is kept
        - Config is persisted automatically to `~/.config/aish/config.yaml`

    plan:
      title: "Plan Mode"
      markdown: |-
        ## What Is Plan Mode?

        Plan mode lets the AI analyze your codebase and create a detailed implementation plan before writing any code. Changes are only applied after you approve the plan.

        ## Commands

        ```
        /plan start     # Enter plan mode
        /plan status    # Show current plan status
        /plan exit      # Exit plan mode
        ```

        You can also toggle plan mode with `Shift+Tab` or `F2`.

        ## Usage

        1. Enter plan mode: `/plan start`
        2. Ask the AI to plan: `; refactor the auth module to use JWT`
        3. The AI generates a plan with steps and file changes
        4. Review the plan and approve or reject each step
        5. Once approved, changes are applied
        6. Exit plan mode: `/plan exit`

        ## Plan Mode vs Normal Mode

        | | Normal Mode | Plan Mode |
        |---|---|---|
        | AI tools | Full access | Read-only + plan writing |
        | Code changes | Immediate | After approval |
        | Best for | Quick fixes, questions | Refactors, new features |

    config:
      title: "Configuration"
      markdown: |-
        ## Config File

        Location: `~/.config/aish/config.yaml`

        Override with `$AISH_CONFIG_DIR` or `$XDG_CONFIG_HOME`.

        ## Priority

        CLI arguments > environment variables > config file

        ## Environment Variables

        | Variable | Purpose |
        |----------|---------|
        | `AISH_MODEL` | Override default model |
        | `AISH_API_KEY` | Override API key |
        | `AISH_API_BASE` | Override API base URL |
        | `AISH_CONFIG_DIR` | Override config directory |

        ## Key Settings

        ```
        model: gpt-4o                    # Default LLM model
        api_key: sk-xxx                  # API key
        api_base: https://api.openai.com/v1  # API endpoint
        temperature: 0.3                 # Response randomness
        theme: dark                      # UI theme (dark/light)
        output_language: en              # Force output language
        ```

        ## Setup Wizard

        Run `/setup` or `aish setup` for interactive configuration.
        Settings take effect immediately without restart.

        ## Other Files

        - Security policy: `~/.config/aish/security_policy.yaml`
        - Session database: `~/.local/share/aish/sessions.db`
        - Logs: `~/.config/aish/logs/aish.log`

    shortcuts:
      title: "Keyboard Shortcuts"
      markdown: |-
        ## Editing

        | Key | Action |
        |-----|--------|
        | `Tab` | Autocomplete |
        | `Up` / `Down` | Navigate history |
        | `Ctrl+R` | Search history |
        | `Ctrl+L` | Clear screen |
        | `Backspace` / `Delete` | Delete character |

        ## Shell Control

        | Key | Action |
        |-----|--------|
        | `Ctrl+C` | Cancel current operation (press twice to exit) |
        | `Ctrl+D` | Exit shell |
        | `Ctrl+O` | Browse output history |
        | `Esc` | Cancel current input |

        ## Session Management

        | Key | Action |
        |-----|--------|
        | `Ctrl+Q` | Detach session (keeps it alive; reconnect with `aish -c`) |
        | `Ctrl+E` | Rename highlighted session (in picker) |

        ## Mode Switching

        | Key | Action |
        |-----|--------|
        | `Shift+Tab` / `F2` | Toggle plan mode |
        | `/` on empty line | Open slash command picker |

    security:
      title: "Security Policy"
      markdown: |-
        ## Overview

        aish uses a security policy file to control which commands and file operations require confirmation or are blocked.

        ## Config Location

        Priority:
        1. Explicit path (if configured)
        2. `/etc/aish/security_policy.yaml`
        3. `~/.config/aish/security_policy.yaml`

        ## Risk Levels

        | Level | Behavior |
        |-------|----------|
        | `LOW` | Allowed, logged |
        | `MEDIUM` | Confirmation prompt |
        | `HIGH` | Blocked or requires explicit confirmation |

        ## Rule Structure

        ```yaml
        rules:
          - id: protect-system
            name: Protect system directories
            path: ["/boot/**", "/etc/passwd"]
            operations: [WRITE, DELETE]
            risk: HIGH
            reason: "System files should not be modified"
        ```

        ## Path Patterns

        - `*` matches any single path segment
        - `**` matches zero or more path segments
        - Variables: `$HOME`, `$PWD`

        ## Secret Detection

        Built-in patterns for detecting API keys (OpenAI, Anthropic, AWS, Google, GitHub, Stripe, Slack), JWT tokens, and URLs with embedded passwords. Custom patterns supported via `secret_patterns`.

  command:
    history:
      title: "📚 History Command"
      description: "Display or manipulate command history"
      usage: "history [options] [n]"
      options:
        - ["--help, -h", "Show this help message"]
        - ["-c", "Clear the history list by deleting all entries"]
        - ["-d offset", "Delete the history entry at position offset"]
        - ["n", "Show only the last n commands"]
      examples:
        - "history              # Show all command history"
        - "history 10           # Show last 10 commands"
        - "history -c           # Clear all history"
        - "history -d 5         # Delete history entry at position 5"
        - "history --help       # Show this help message"
      notes: "History entries are automatically recorded for all executed commands and AI interactions."

    cd:
      title: "📁 Change Directory"
      description: "Change the current working directory with full parameter support"
      usage: "cd [-L|[-P [-e]]] [directory]"
      options:
        - ["-L", "Force symbolic links to be followed: resolve symbolic links after processing '..' instances (default)"]
        - ["-P", "Use physical directory structure without following symbolic links: resolve symbolic links before processing '..' instances"]
        - ["-e", "If -P option is provided and current working directory cannot be determined, exit with non-zero status"]
        # - ["-@", "On systems that support it, present files with extended attributes as directories containing file attributes"]
        - ["directory", "Target directory path (optional, defaults to home directory)"]
        - ["-", "Return to previous directory"]
      examples:
        - "cd ~                 # Switch to home directory"
        - "cd /tmp              # Switch to /tmp directory"
        - "cd -                 # Return to previous directory"
        - "cd \"path with spaces\" # Use quotes for paths with spaces"
        - "cd -P /tmp           # Use physical path resolution"
        - "cd -P -e /tmp        # Use physical path resolution, exit on error"
        - "cd -L /tmp           # Force following symbolic links (default behavior)"
        # - "cd -@ /tmp           # Show extended attributes (if supported)"
      notes: "Supports tab completion and handling of paths with special characters. Default behavior follows symbolic links (-L)."

    pushd:
      title: "📤 Push Directory"
      description: "Push directory onto stack and change to it"
      usage: "pushd [directory]"
      options:
        - ["directory", "Target directory path"]
        - ["(no args)", "Swap top two directories on stack"]
      examples:
        - "pushd /tmp           # Push current dir to stack, go to /tmp"
        - "pushd                # Swap between current and previous directory"
      notes: "Maintains a directory stack for easy navigation between multiple directories."

    popd:
      title: "📥 Pop Directory"
      description: "Pop directory from stack and change to it"
      usage: "popd"
      options: []
      examples:
        - "popd                 # Return to previous directory from stack"
      notes: "Removes the top directory from the stack and changes to it."

    dirs:
      title: "📋 Show Directory Stack"
      description: "Display the directory stack"
      usage: "dirs [-c]"
      options:
        - ["-c", "Clear the directory stack"]
      examples:
        - "dirs                 # Show current directory stack"
        - "dirs -c              # Clear directory stack"
      notes: "Shows all directories currently on the navigation stack."

    help:
      title: "❓ Help Command"
      description: "Show available commands and features"
      usage: "help"
      options: []
      examples:
        - "help                 # Show general help information"
      notes: "Provides overview of all available commands and shell features."

    clear:
      title: "🧹 Clear Screen"
      description: "Clear the terminal screen"
      usage: "clear"
      options: []
      examples:
        - "clear                # Clear the terminal screen"
      notes: "Equivalent to the standard Unix clear command."

    exit:
      title: "🚪 Exit Shell"
      description: "Exit the AI Shell"
      usage: "exit"
      options: []
      examples:
        - "exit                 # Exit the shell"
        - "quit                 # Alternative way to exit"
      notes: "Cleanly exits the shell, preserving session data."

    export:
      title: "🔧 Export Environment Variables"
      description: "Set or display environment variables with export attributes"
      usage: "export [-fn] [name[=value] ...]\nexport -p"
      options:
        - ["-f", "Name refers to a shell function (not supported)"]
        - ["-n", "Remove export attribute from each name"]
        - ["-p", "Display list of all exported variables"]
        - ["--", "Disable further option processing"]
      examples:
        - "export PATH=/usr/local/bin:$PATH"
        - "export EDITOR=vim"
        - "export -n VAR  # Remove export attribute from VAR"
        - "export -p      # Display all exported variables"
        - "export JAVA_HOME=\"/usr/lib/jvm/java-11-openjdk\""
        - "export -- -VAR  # Set variable named -VAR"
      notes: "Environment variables set with export are passed to child processes."

    unset:
      title: "🗑️ Unset Environment Variables"
      description: "Unset shell variables and functions"
      usage: "unset [-f] [-v] [-n] [name ...]"
      options:
        - ["-f", "Each name refers to a shell function (not supported)"]
        - ["-v", "Each name refers to a shell variable (default)"]
        - ["-n", "Each name refers to a name reference (not supported)"]
        - ["--", "Disable further option processing"]
      examples:
        - "unset TEMP_VAR"
        - "unset -v VAR1 VAR2"
        - "unset JAVA_HOME"
        - "unset -- -VAR  # Unset variable named -VAR"
      notes: "Removes variables from the shell environment. Variables that don't exist are ignored."

    pwd:
      title: "📍 Print Working Directory"
      description: "Print the current working directory with symlink handling"
      usage: "pwd [-L|-P]"
      options:
        - ["-L", "Show logical path (follow symlinks, default)"]
        - ["-P", "Show physical path (resolve symlinks)"]
      examples:
        - "pwd                  # Show logical current directory"
        - "pwd -L               # Show logical path (respect symlinks)"
        - "pwd -P               # Show physical path (resolve symlinks)"
      notes: "Default behavior shows logical path that respects symbolic links."

    ";":
      title: "🤖 AI Assistant"
      description: "Ask the AI assistant a question"
      usage: "; <question>"
      options:
        - ["question", "Your question for the AI assistant"]
      examples:
        - "; how do I find large files?"
