help:
  labels:
    usage: "使い方"
    options: "オプション"
    examples: "例"
    notes: "補足"
    brief_usage: "使い方: {usage}"
  general:
    title: "AI Shell ヘルプ"
    markdown: |-
      ## クイックスタート
      - **シェルコマンド** — そのまま入力：`ls`、`cd`、`vim`、`ssh`、`top` …
      - **AI に質問** — `;` または `；` で始める：`;大きなファイルを見つける方法`
      - **スラッシュコマンド** — 空行で `/` を押すとインタラクティブピッカーが開きます

      ## スラッシュコマンド
      | コマンド | 説明 |
      |----------|------|
      | `/help [page]` | ヘルプを表示（`/help` でページ一覧） |
      | `/quit` | AI Shell を終了 |
      | `/model [名前]` | AI モデルを表示または切り替え |
      | `/setup` | API 設定を再構成 |
      | `/setting` | 対話型設定パネルを開く |
      | `/plan [start\|status\|exit]` | プランモードの制御 |
      | `/token` | トークン使用量を表示（過去 7 日間） |
      | `/resume [id]` | 前回のセッションを再開 |
      | `/feedback` | フィードバックを送信またはバグを報告 |

      ## 設定
      - 設定ファイル：`~/.config/aish/config.yaml`
      - 優先度：コマンドライン引数 > 環境変数（`AISH_MODEL`、`AISH_API_KEY`、`AISH_API_BASE`） > 設定ファイル
      - `/setup` または `aish setup` でインタラクティブに設定

      ## セッション管理
      - `aish -c` — 既存のライブセッションに接続（またはリストから選択）
      - `Ctrl+Q` — 現在のセッションを切り離す（バックグラウンドで継続）；`aish -c` で再接続
      - `Ctrl+E` — ピッカーで選択中のセッションの名前を変更

      ## キーボードショートカット
      | キー | 操作 |
      |------|------|
      | `Ctrl+C` | 現在の操作をキャンセル（2 回押すと終了） |
      | `Ctrl+D` | シェルを終了 |
      | `Shift+Tab` / `F2` | プランモード切替 |
      | `Ctrl+O` | 出力履歴を閲覧 |
      | `Ctrl+Q` | セッションを切り離す（`aish -c` で再接続） |
      | `Ctrl+E` | セッションの名前を変更（ピッカー内） |
      | 空行で `/` | スラッシュコマンドピッカー |

      ## ヘルプページ
      `/help <page>` で aish 固有機能の詳細を確認：

      | ページ | 内容 |
      |--------|------|
      | `ai` | AIアシスタントの使い方（`;`プレフィックス、コンテキスト、会話） |
      | `model` | モデル管理（表示、切替、対応プロバイダー） |
      | `plan` | プランモード（ワークフロー、承認、通常モードとの比較） |
      | `config` | 設定（ファイル、環境変数、優先順位） |
      | `shortcuts` | キーボードショートカット（編集、制御、モード切替） |
      | `security` | セキュリティポリシー（リスクレベル、ルール、シークレット検出） |

      ## その他
      - セキュリティポリシー：`~/.config/aish/security_policy.yaml`
      - セッションデータ：`~/.local/share/aish/sessions.db`
      - ログ：`~/.config/aish/logs/aish.log`
      - ドキュメント：https://github.com/AI-Shell-Team/aish

  topics:
    unknown: "不明なヘルプページ '{topic}'。利用可能なページ：ai, model, plan, config, shortcuts, security"

    ai:
      title: "AI アシスタント"
      markdown: |-
        ## AI への質問

        `;`（セミコロン）または `；`（全角セミコロン）を前に付けて質問します：

        ```
        ; 大きなファイルを見つける方法は？
        ; このコマンドを説明して：ls -la
        ; より良い圧縮方法を提案して
        ```

        AI は以前のシェルコマンドや AI 応答を含む会話コンテキストを参照します。

        ## 仕組み

        - 質問は設定された LLM モデルに送信されます
        - AI は会話履歴をコンテキストとして受け取ります
        - 応答はシンタックスハイライトとテーブル描画で表示されます

        ## コンテキスト管理

        - 会話履歴は自動的に維持されます
        - トークン予算を超えると自動的にコンテキストを圧縮します
        - 古いメッセージは要約され、最新のコンテキストが保持されます

    model:
      title: "モデル管理"
      markdown: |-
        ## モデルの確認と切り替え

        ```
        /model                    # 現在のモデルを表示
        /model gpt-4o             # GPT-4o に切り替え
        /model claude-sonnet-4-6  # Claude に切り替え
        ```

        ## 対応プロバイダー

        | プロバイダー | モデルプレフィックス |
        |-------------|-------------------|
        | OpenAI | `gpt-*`, `o1-*`, `o3-*`, `o4-*` |
        | Anthropic | `claude-*` |
        | Google | `gemini-*`, `gemma-*` |
        | DeepSeek | `deepseek-*` |
        | Qwen | `qwen-*`, `qwq-*` |
        | Mistral | `mistral-*`, `mixtral-*`, `codestral-*` |
        | xAI | `grok-*` |
        | Moonshot | `kimi-*`, `moonshot-*` |
        | Zhipu | `glm-*` |
        | ローカル | Ollama, vLLM, ローカル API |

        ## 切り替え動作

        - モデル名からプロバイダーを自動検出
        - 切り替え前に接続性を検証
        - 失敗時は現在のモデルを維持
        - 設定は `~/.config/aish/config.yaml` に自動保存

    plan:
      title: "プランモード"
      markdown: |-
        ## プランモードとは？

        プランモードでは、AI がコードを書く前にコードベースを分析し、詳細な実装計画を作成します。変更は承認後にのみ適用されます。

        ## コマンド

        ```
        /plan start     # プランモードに入る
        /plan status    # 現在のプラン状態を表示
        /plan exit      # プランモードを終了
        ```

        `Shift+Tab` または `F2` でプランモードを切り替えることもできます。

        ## 使い方

        1. プランモードに入る：`/plan start`
        2. AI に計画を依頼：`; auth モジュールを JWT にリファクタリングして`
        3. AI がステップとファイル変更を含む計画を生成
        4. 計画を確認し、各ステップを承認または拒否
        5. 承認後、変更が適用される
        6. プランモードを終了：`/plan exit`

        ## プランモード vs 通常モード

        | | 通常モード | プランモード |
        |---|---|---|
        | AI ツール | フルアクセス | 読み取り専用 + プラン書き込み |
        | コード変更 | 即時実行 | 承認後実行 |
        | 適した場面 | 簡単な修正、質問 | リファクタリング、新機能 |

    config:
      title: "設定"
      markdown: |-
        ## 設定ファイル

        場所：`~/.config/aish/config.yaml`

        `$AISH_CONFIG_DIR` または `$XDG_CONFIG_HOME` で上書き可能。

        ## 優先順位

        コマンドライン引数 > 環境変数 > 設定ファイル

        ## 環境変数

        | 変数 | 用途 |
        |------|------|
        | `AISH_MODEL` | デフォルトモデルを上書き |
        | `AISH_API_KEY` | API キーを上書き |
        | `AISH_API_BASE` | API ベース URL を上書き |
        | `AISH_CONFIG_DIR` | 設定ディレクトリを上書き |

        ## 主な設定項目

        ```
        model: gpt-4o                    # デフォルト LLM モデル
        api_key: sk-xxx                  # API キー
        api_base: https://api.openai.com/v1  # API エンドポイント
        temperature: 0.3                 # 応答のランダム性
        theme: dark                      # UI テーマ（dark/light）
        output_language: ja              # 出力言語の強制
        ```

        ## セットアップウィザード

        `/setup` または `aish setup` でインタラクティブに設定できます。設定は再起動なしで即座に反映されます。

        ## その他のファイル

        - セキュリティポリシー：`~/.config/aish/security_policy.yaml`
        - セッションデータベース：`~/.local/share/aish/sessions.db`
        - ログ：`~/.config/aish/logs/aish.log`

    shortcuts:
      title: "キーボードショートカット"
      markdown: |-
        ## 編集

        | キー | 操作 |
        |------|------|
        | `Tab` | 自動補完 |
        | `↑` / `↓` | 履歴を参照 |
        | `Ctrl+R` | 履歴検索 |
        | `Ctrl+L` | 画面クリア |
        | `Backspace` / `Delete` | 文字削除 |

        ## シェル制御

        | キー | 操作 |
        |------|------|
        | `Ctrl+C` | 現在の操作をキャンセル（2 回押しで終了） |
        | `Ctrl+D` | シェルを終了 |
        | `Ctrl+O` | 出力履歴を参照 |
        | `Esc` | 現在の入力をキャンセル |

        ## セッション管理

        | キー | 操作 |
        |------|------|
        | `Ctrl+Q` | セッションを切り離す（継続実行；`aish -c` で再接続） |
        | `Ctrl+E` | 選択中のセッションの名前を変更（ピッカー内） |

        ## モード切替

        | キー | 操作 |
        |------|------|
        | `Shift+Tab` / `F2` | プランモード切替 |
        | 空行で `/` | スラッシュコマンドピッカーを開く |

    security:
      title: "セキュリティポリシー"
      markdown: |-
        ## 概要

        aish はセキュリティポリシーファイルを使用して、確認が必要またはブロックされるコマンドやファイル操作を制御します。

        ## 設定場所

        優先順位：
        1. 明示的に指定されたパス
        2. `/etc/aish/security_policy.yaml`
        3. `~/.config/aish/security_policy.yaml`

        ## リスクレベル

        | レベル | 動作 |
        |--------|------|
        | `LOW` | 許可、ログ記録 |
        | `MEDIUM` | 確認プロンプト |
        | `HIGH` | ブロックまたは明示的な確認が必要 |

        ## ルール構造

        ```yaml
        rules:
          - id: protect-system
            name: システムディレクトリの保護
            path: ["/boot/**", "/etc/passwd"]
            operations: [WRITE, DELETE]
            risk: HIGH
            reason: "システムファイルは変更すべきではありません"
        ```

        ## パスパターン

        - `*` は単一のパスセグメントにマッチ
        - `**` はゼロ以上のパスセグメントにマッチ
        - 変数：`$HOME`、`$PWD`

        ## シークレット検出

        OpenAI、Anthropic、AWS、Google、GitHub、Stripe、Slack の API キー、JWT トークン、埋め込みパスワードを含む URL の検出パターンが組み込まれています。`secret_patterns` でカスタムパターンを追加できます。

  command:
    history:
      title: "📚 履歴"
      description: "コマンド履歴を表示または操作します"
      usage: "history [options] [n]"
      options:
        - ["--help, -h", "このヘルプメッセージを表示します"]
        - ["-c", "すべての項目を削除して履歴一覧を消去します"]
        - ["-d offset", "位置 offset の履歴項目を削除します"]
        - ["n", "直近 n 件のコマンドのみ表示します"]
      examples:
        - "history              # すべてのコマンド履歴を表示します"
        - "history 10           # 直近 10 件のコマンドを表示します"
        - "history -c           # すべての履歴を消去します"
        - "history -d 5         # 位置 5 の履歴項目を削除します"
        - "history --help       # このヘルプメッセージを表示します"
      notes: "実行したすべてのコマンドと AI との対話は自動的に履歴へ記録されます。"

    cd:
      title: "📁 ディレクトリ移動"
      description: "完全な引数サポート付きで現在の作業ディレクトリを変更します"
      usage: "cd [-L|[-P [-e]]] [directory]"
      options:
        - ["-L", "シンボリックリンクをたどります: '..' を処理した後にリンクを解決します（既定）"]
        - ["-P", "シンボリックリンクをたどらず物理ディレクトリ構造を使います: '..' を処理する前にリンクを解決します"]
        - ["-e", "-P が指定され、現在の作業ディレクトリを判定できない場合は非ゼロ終了します"]
        # - ["-@", "対応システムでは、拡張属性を持つファイルを属性を含むディレクトリとして表示します"]
        - ["directory", "移動先ディレクトリのパス（省略時はホームディレクトリ）"]
        - ["-", "前のディレクトリに戻ります"]
      examples:
        - "cd ~                 # ホームディレクトリへ移動します"
        - "cd /tmp              # /tmp ディレクトリへ移動します"
        - "cd -                 # 前のディレクトリに戻ります"
        - "cd \"path with spaces\" # スペースを含むパスでは引用符を使います"
        - "cd -P /tmp           # 物理パス解決を使います"
        - "cd -P -e /tmp        # 物理パス解決を使い、エラー時に終了します"
        - "cd -L /tmp           # シンボリックリンクをたどります（既定動作）"
        # - "cd -@ /tmp           # 拡張属性を表示します（対応時）"
      notes: "Tab 補完と特殊文字を含むパスの処理に対応しています。既定ではシンボリックリンクをたどります（-L）。"

    pushd:
      title: "📤 ディレクトリをスタックに追加"
      description: "ディレクトリをスタックに積み、その場所へ移動します"
      usage: "pushd [directory]"
      options:
        - ["directory", "移動先ディレクトリのパス"]
        - ["(no args)", "スタック先頭の 2 つのディレクトリを入れ替えます"]
      examples:
        - "pushd /tmp           # 現在のディレクトリをスタックに積み、/tmp へ移動します"
        - "pushd                # 現在と直前のディレクトリを入れ替えます"
      notes: "複数のディレクトリ間を簡単に移動できるよう、ディレクトリスタックを維持します。"

    popd:
      title: "📥 ディレクトリをスタックから取り出す"
      description: "スタックからディレクトリを取り出し、その場所へ移動します"
      usage: "popd"
      options: []
      examples:
        - "popd                 # スタックから前のディレクトリへ戻ります"
      notes: "スタック先頭のディレクトリを取り除き、その場所へ移動します。"

    dirs:
      title: "📋 ディレクトリスタック表示"
      description: "ディレクトリスタックを表示します"
      usage: "dirs [-c]"
      options:
        - ["-c", "ディレクトリスタックを消去します"]
      examples:
        - "dirs                 # 現在のディレクトリスタックを表示します"
        - "dirs -c              # ディレクトリスタックを消去します"
      notes: "現在ナビゲーションスタックにあるすべてのディレクトリを表示します。"

    help:
      title: "❓ ヘルプ"
      description: "利用可能なコマンドと機能を表示します"
      usage: "help"
      options: []
      examples:
        - "help                 # 一般的なヘルプ情報を表示します"
      notes: "利用可能なすべてのコマンドとシェル機能の概要を表示します。"

    clear:
      title: "🧹 画面クリア"
      description: "ターミナル画面を消去します"
      usage: "clear"
      options: []
      examples:
        - "clear                # ターミナル画面を消去します"
      notes: "標準的な Unix の clear コマンドと同等です。"

    exit:
      title: "🚪 シェル終了"
      description: "AI Shell を終了します"
      usage: "exit"
      options: []
      examples:
        - "exit                 # シェルを終了します"
        - "quit                 # 別の終了方法です"
      notes: "セッションデータを保持したままシェルを正常終了します。"

    export:
      title: "🔧 環境変数を export"
      description: "export 属性付きで環境変数を設定または表示します"
      usage: "export [-fn] [name[=value] ...]\nexport -p"
      options:
        - ["-f", "名前はシェル関数を指します（未対応）"]
        - ["-n", "各名前から export 属性を削除します"]
        - ["-p", "export 済み変数の一覧を表示します"]
        - ["--", "以降のオプション処理を無効にします"]
      examples:
        - "export PATH=/usr/local/bin:$PATH"
        - "export EDITOR=vim"
        - "export -n VAR  # VAR から export 属性を削除します"
        - "export -p      # export 済み変数をすべて表示します"
        - "export JAVA_HOME=\"/usr/lib/jvm/java-11-openjdk\""
        - "export -- -VAR  # -VAR という名前の変数を設定します"
      notes: "export で設定した環境変数は子プロセスへ引き継がれます。"

    unset:
      title: "🗑️ 環境変数を解除"
      description: "シェル変数と関数を削除します"
      usage: "unset [-f] [-v] [-n] [name ...]"
      options:
        - ["-f", "各名前はシェル関数を指します（未対応）"]
        - ["-v", "各名前はシェル変数を指します（既定）"]
        - ["-n", "各名前は名前参照を指します（未対応）"]
        - ["--", "以降のオプション処理を無効にします"]
      examples:
        - "unset TEMP_VAR"
        - "unset -v VAR1 VAR2"
        - "unset JAVA_HOME"
        - "unset -- -VAR  # -VAR という名前の変数を削除します"
      notes: "シェル環境から変数を削除します。存在しない変数は無視されます。"

    pwd:
      title: "📍 作業ディレクトリ表示"
      description: "シンボリックリンク処理付きで現在の作業ディレクトリを表示します"
      usage: "pwd [-L|-P]"
      options:
        - ["-L", "論理パスを表示します（シンボリックリンクをたどる、既定）"]
        - ["-P", "物理パスを表示します（シンボリックリンクを解決する）"]
      examples:
        - "pwd                  # 論理的な現在ディレクトリを表示します"
        - "pwd -L               # 論理パスを表示します（シンボリックリンクを考慮）"
        - "pwd -P               # 物理パスを表示します（シンボリックリンクを解決）"
      notes: "既定ではシンボリックリンクを考慮した論理パスを表示します。"

    ";":
      title: "🤖 AI アシスタント"
      description: "AI アシスタントに質問します"
      usage: "; <question>"
      options:
        - ["question", "AI アシスタントへの質問"]
      examples:
        - "; 大きいファイルを見つけるには？"
        - "; このコマンドを説明して: ls -la"
        - "; ファイルを圧縮するもっと良い方法を提案して"
      notes: "AI アシスタントは、コマンドの説明、提案、一般的なシェルの使い方を支援できます。"

    "；":
      title: "🤖 AI アシスタント"
      description: "AI アシスタントに質問します"
      usage: "； <question>"
      options:
        - ["question", "AI アシスタントへの質問"]
      examples:
        - "； 大きいファイルを見つけるには？"
        - "； このコマンドを説明して: ls -la"
        - "； ファイルを圧縮するもっと良い方法を提案して"
      notes: "AI アシスタントは、コマンドの説明、提案、一般的なシェルの使い方を支援できます。"

    "/model":
      title: "🧠 モデル切替"
      description: "現在のモデルを表示するか、指定したモデルへ切り替えます"
      usage: "/model [model]"
      options:
        - ["model", "切り替え先のモデル識別子（ツール呼び出し対応を検証します）"]
        - ["--help, -h", "このヘルプメッセージを表示します"]
      examples:
        - "/model               # 現在のモデルを表示します"
        - "/model gpt-4         # モデルを切り替えます"
        - "/model --help        # ヘルプを表示します"
      notes: "切り替え時には接続性とツール呼び出し対応を検証し、失敗した場合は現在のモデルを維持します。"

    "/setup":
      title: "⚙️ 再設定"
      description: "対話型セットアップウィザードを再実行し、API 設定（プロバイダー、API キー、モデル）を変更します"
      usage: "/setup"
      options:
        - ["--help, -h", "このヘルプメッセージを表示します"]
      examples:
        - "/setup               # セットアップウィザードを起動します"
        - "/setup --help        # ヘルプを表示します"
      notes: "新しい設定は再起動なしで直ちに適用されます。キャンセルした場合は現在の設定が維持されます。"

errors:
  litellm_not_installed: "litellm モジュールがインストールされていません"