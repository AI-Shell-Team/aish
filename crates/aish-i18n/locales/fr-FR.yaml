    examples: "Exemples"
    notes: "Notes"
    brief_usage: "Utilisation : {usage}"
  general:
    title: "Aide AI Shell"
    markdown: |-
      ## Démarrage rapide
      - **Commandes Shell** — saisissez directement : `ls`, `cd`, `vim`, `ssh`, `top` …
      - **Demander à l'IA** — préfixez par `;` : `;comment trouver les gros fichiers`
      - **Commandes slash** — appuyez sur `/` sur une ligne vide pour le sélecteur interactif

      ## Commandes Slash
      | Commande | Description |
      |----------|-------------|
      | `/help [page]` | Afficher l'aide (`/help` pour les pages) |
      | `/quit` | Quitter AI Shell |
      | `/model [nom]` | Afficher ou changer le modèle IA |
      | `/setup` | Reconfigurer les paramètres API |
      | `/setting` | Ouvrir le panneau de configuration interactif |
      | `/plan [start\|status\|exit]` | Contrôle du mode plan |
      | `/token` | Afficher l'utilisation des tokens (7 derniers jours) |
      | `/resume [id]` | Reprendre une session précédente |
      | `/feedback` | Envoyer un commentaire ou signaler un bug |

      ## Configuration
      - Fichier de configuration : `~/.config/aish/config.yaml`
      - Priorité : arguments CLI > variables d'environnement (`AISH_MODEL`, `AISH_API_KEY`, `AISH_API_BASE`) > fichier de config
      - Exécutez `/setup` ou `aish setup` pour la configuration interactive

      ## Gestion des sessions
      - `aish -c` — se connecter à une session active (ou choisir dans une liste)
      - `Ctrl+Q` — détacher la session courante (continue en arrière-plan) ; reconnecter avec `aish -c`
      - `Ctrl+E` — renommer la session sélectionnée dans le sélecteur

      ## Raccourcis clavier
      | Touche | Action |
      |--------|--------|
      | `Ctrl+C` | Annuler l'opération en cours (appuyer deux fois pour quitter) |
      | `Ctrl+D` | Quitter le shell |
      | `Shift+Tab` / `F2` | Basculer le mode plan |
      | `Ctrl+O` | Parcourir l'historique de sortie |
      | `Ctrl+Q` | Détacher la session (reconnecter avec `aish -c`) |
      | `Ctrl+E` | Renommer la session (dans le sélecteur) |
      | `/` sur ligne vide | Sélecteur de commandes slash |

      ## Pages d'aide
      `/help <page>` pour les détails sur les fonctions spécifiques d'aish :

      | Page | Contenu |
      |------|---------|
      | `ai` | Assistant IA (préfixe `;`, contexte, conversation) |
      | `model` | Gestion des modèles (afficher, changer, fournisseurs) |
      | `plan` | Mode plan (flux, approbation, vs mode normal) |
      | `config` | Configuration (fichiers, variables, priorité) |
      | `shortcuts` | Raccourcis clavier (édition, contrôle, changement de mode) |
      | `security` | Politique de sécurité (niveaux, règles, détection) |

      ## Plus
      - Politique de sécurité : `~/.config/aish/security_policy.yaml`
      - Base de données de sessions : `~/.local/share/aish/sessions.db`
      - Journaux : `~/.config/aish/logs/aish.log`
      - Documentation : https://github.com/AI-Shell-Team/aish

  topics:
    unknown: "Page d'aide inconnue '{topic}'. Pages disponibles : ai, model, plan, config, shortcuts, security"

    ai:
      title: "Assistant IA"
      markdown: |-
        ## Poser une question à l'IA

        Préfixez votre question avec `;` (point-virgule) ou `；` (point-virgule pleine chasse) :

        ```
        ; comment trouver les gros fichiers ?
        ; explique cette commande : ls -la
        ; suggère une meilleure méthode de compression
        ```

        L'IA voit le contexte de votre conversation, y compris les commandes shell précédentes et les réponses de l'IA.

        ## Fonctionnement

        - Votre question est envoyée au modèle LLM configuré
        - L'IA reçoit l'historique de conversation comme contexte
        - Les réponses sont affichées avec coloration syntaxique et formatage de tableaux

        ## Gestion du contexte

        - L'historique de conversation est maintenu automatiquement
        - Le compactage automatique se déclenche quand le budget de tokens est dépassé
        - Les anciens messages sont résumés pour garder le contexte récent

    model:
      title: "Gestion des modèles"
      markdown: |-
        ## Afficher et changer de modèle

        ```
        /model                    # Afficher le modèle actuel
        /model gpt-4o             # Passer à GPT-4o
        /model claude-sonnet-4-6  # Passer à Claude
        ```

        ## Fournisseurs pris en charge

        | Fournisseur | Préfixe du modèle |
        |-------------|------------------|
        | OpenAI | `gpt-*`, `o1-*`, `o3-*`, `o4-*` |
        | Anthropic | `claude-*` |
        | Google | `gemini-*`, `gemma-*` |
        | DeepSeek | `deepseek-*` |
        | Qwen | `qwen-*`, `qwq-*` |
        | Mistral | `mistral-*`, `mixtral-*`, `codestral-*` |
        | xAI | `grok-*` |
        | Moonshot | `kimi-*`, `moonshot-*` |
        | Zhipu | `glm-*` |
        | Local | Ollama, vLLM, API locale |

        ## Comportement du changement

        - Le fournisseur est détecté automatiquement selon le nom du modèle
        - La connectivité est validée avant le changement
        - En cas d'échec, le modèle actuel est conservé
        - La config est sauvegardée automatiquement dans `~/.config/aish/config.yaml`

    plan:
      title: "Mode Plan"
      markdown: |-
        ## Qu'est-ce que le mode Plan ?

        Le mode Plan permet à l'IA d'analyser votre base de code et de créer un plan d'implémentation détaillé avant d'écrire du code. Les modifications ne sont appliquées qu'après votre approbation.

        ## Commandes

        ```
        /plan start     # Entrer en mode plan
        /plan status    # Afficher l'état du plan actuel
        /plan exit      # Quitter le mode plan
        ```

        Vous pouvez aussi basculer le mode plan avec `Shift+Tab` ou `F2`.

        ## Utilisation

        1. Entrer en mode plan : `/plan start`
        2. Demander à l'IA de planifier : `; refactoriser le module auth pour utiliser JWT`
        3. L'IA génère un plan avec des étapes et des modifications de fichiers
        4. Examiner le plan et approuver ou rejeter chaque étape
        5. Une fois approuvé, les modifications sont appliquées
        6. Quitter le mode plan : `/plan exit`

        ## Mode Plan vs Mode Normal

        | | Mode Normal | Mode Plan |
        |---|---|---|
        | Outils IA | Accès complet | Lecture seule + écriture du plan |
        | Modifications | Immédiates | Après approbation |
        | Idéal pour | Corrections rapides, questions | Refactorisation, nouvelles fonctionnalités |

    config:
      title: "Configuration"
      markdown: |-
        ## Fichier de configuration

        Emplacement : `~/.config/aish/config.yaml`

        Remplaçable avec `$AISH_CONFIG_DIR` ou `$XDG_CONFIG_HOME`.

        ## Priorité

        Arguments CLI > variables d'environnement > fichier de configuration

        ## Variables d'environnement

        | Variable | Usage |
        |----------|-------|
        | `AISH_MODEL` | Remplacer le modèle par défaut |
        | `AISH_API_KEY` | Remplacer la clé API |
        | `AISH_API_BASE` | Remplacer l'URL de base de l'API |
        | `AISH_CONFIG_DIR` | Remplacer le répertoire de configuration |

        ## Paramètres principaux

        ```
        model: gpt-4o                    # Modèle LLM par défaut
        api_key: sk-xxx                  # Clé API
        api_base: https://api.openai.com/v1  # Point d'accès API
        temperature: 0.3                 # Aléatoire des réponses
        theme: dark                      # Thème UI (dark/light)
        output_language: fr              # Forcer la langue de sortie
        ```

        ## Assistant de configuration

        Exécutez `/setup` ou `aish setup` pour une configuration interactive. Les paramètres prennent effet immédiatement sans redémarrage.

        ## Autres fichiers

        - Politique de sécurité : `~/.config/aish/security_policy.yaml`
        - Base de données de sessions : `~/.local/share/aish/sessions.db`
        - Journaux : `~/.config/aish/logs/aish.log`

    shortcuts:
      title: "Raccourcis clavier"
      markdown: |-
        ## Édition

        | Touche | Action |
        |--------|--------|
        | `Tab` | Auto-complétion |
        | `↑` / `↓` | Naviguer dans l'historique |
        | `Ctrl+R` | Rechercher dans l'historique |
        | `Ctrl+L` | Effacer l'écran |
        | `Backspace` / `Delete` | Supprimer un caractère |

        ## Contrôle du shell

        | Touche | Action |
        |--------|--------|
        | `Ctrl+C` | Annuler l'opération en cours (appuyer deux fois pour quitter) |
        | `Ctrl+D` | Quitter le shell |
        | `Ctrl+O` | Parcourir l'historique de sortie |
        | `Échap` | Annuler la saisie en cours |

        ## Gestion des sessions

        | Touche | Action |
        |--------|--------|
        | `Ctrl+Q` | Détacher la session (reste active ; reconnecter avec `aish -c`) |
        | `Ctrl+E` | Renommer la session sélectionnée (dans le sélecteur) |

        ## Changement de mode

        | Touche | Action |
        |--------|--------|
        | `Shift+Tab` / `F2` | Basculer le mode plan |
        | `/` sur ligne vide | Ouvrir le sélecteur de commandes |

    security:
      title: "Politique de sécurité"
      markdown: |-
        ## Aperçu

        aish utilise un fichier de politique de sécurité pour contrôler quelles commandes et opérations de fichiers nécessitent une confirmation ou sont bloquées.

        ## Emplacement de la configuration

        Priorité :
        1. Chemin explicitement spécifié
        2. `/etc/aish/security_policy.yaml`
        3. `~/.config/aish/security_policy.yaml`

        ## Niveaux de risque

        | Niveau | Comportement |
        |--------|-------------|
        | `LOW` | Autorisé, journalisé |
        | `MEDIUM` | Demande de confirmation |
        | `HIGH` | Bloqué ou nécessite une confirmation explicite |

        ## Structure des règles

        ```yaml
        rules:
          - id: protect-system
            name: Protéger les répertoires système
            path: ["/boot/**", "/etc/passwd"]
            operations: [WRITE, DELETE]
            risk: HIGH
            reason: "Les fichiers système ne doivent pas être modifiés"
        ```

        ## Motifs de chemin

        - `*` correspond à un seul segment de chemin
        - `**` correspond à zéro ou plusieurs segments de chemin
        - Variables : `$HOME`, `$PWD`

        ## Détection de secrets

        Motifs intégrés pour la détection de clés API (OpenAI, Anthropic, AWS, Google, GitHub, Stripe, Slack), de tokens JWT et d'URL avec mots de passe intégrés. Motifs personnalisés via `secret_patterns`.

  command:
    history:
      title: "📚 Historique"
      description: "Afficher ou manipuler l'historique des commandes"
      usage: "history [options] [n]"
      options:
        - ["--help, -h", "Afficher ce message d'aide"]
        - ["-c", "Effacer la liste d'historique en supprimant toutes les entrees"]
        - ["-d offset", "Supprimer l'entree d'historique a la position offset"]
        - ["n", "Afficher seulement les n dernieres commandes"]
      examples:
        - "history              # Afficher tout l'historique des commandes"
        - "history 10           # Afficher les 10 dernieres commandes"
        - "history -c           # Effacer tout l'historique"
        - "history -d 5         # Supprimer l'entree d'historique a la position 5"
        - "history --help       # Afficher ce message d'aide"
      notes: "Les entrees d'historique sont enregistrees automatiquement pour toutes les commandes executees et les interactions avec l'IA."

    cd:
      title: "📁 Changer de repertoire"
      description: "Changer le repertoire de travail courant avec prise en charge complete des parametres"
      usage: "cd [-L|[-P [-e]]] [directory]"
      options:
        - ["-L", "Forcer le suivi des liens symboliques : resoudre les liens symboliques apres le traitement des occurrences de '..' (par defaut)"]
        - ["-P", "Utiliser la structure physique des repertoires sans suivre les liens symboliques : resoudre les liens symboliques avant le traitement des occurrences de '..'"]
        - ["-e", "Si l'option -P est fournie et que le repertoire de travail courant ne peut pas etre determine, quitter avec un code non nul"]
        # - ["-@", "Sur les systemes qui le prennent en charge, presenter les fichiers avec attributs etendus comme des repertoires contenant les attributs du fichier"]
        - ["directory", "Chemin du repertoire cible (optionnel, utilise le repertoire personnel par defaut)"]
        - ["-", "Revenir au repertoire precedent"]
      examples:
        - "cd ~                 # Aller au repertoire personnel"
        - "cd /tmp              # Aller au repertoire /tmp"
        - "cd -                 # Revenir au repertoire precedent"
        - "cd \"path with spaces\" # Utiliser des guillemets pour les chemins contenant des espaces"
        - "cd -P /tmp           # Utiliser la resolution de chemin physique"
        - "cd -P -e /tmp        # Utiliser la resolution de chemin physique et quitter en cas d'erreur"
        - "cd -L /tmp           # Forcer le suivi des liens symboliques (comportement par defaut)"
        # - "cd -@ /tmp           # Afficher les attributs etendus (si pris en charge)"
      notes: "Prend en charge l'autocompletion par Tab et les chemins avec caracteres speciaux. Le comportement par defaut suit les liens symboliques (-L)."

    pushd:
      title: "📤 Empiler un repertoire"
      description: "Ajouter un repertoire a la pile et s'y deplacer"
      usage: "pushd [directory]"
      options:
        - ["directory", "Chemin du repertoire cible"]
        - ["(no args)", "Echanger les deux repertoires au sommet de la pile"]
      examples:
        - "pushd /tmp           # Ajouter le repertoire courant a la pile et aller a /tmp"
        - "pushd                # Echanger entre le repertoire courant et le precedent"
      notes: "Maintient une pile de repertoires pour naviguer facilement entre plusieurs repertoires."

    popd:
      title: "📥 Depiler un repertoire"
      description: "Retirer un repertoire de la pile et s'y deplacer"
      usage: "popd"
      options: []
      examples:
        - "popd                 # Revenir au repertoire precedent depuis la pile"
      notes: "Retire le repertoire au sommet de la pile et s'y deplace."

    dirs:
      title: "📋 Afficher la pile de repertoires"
      description: "Afficher la pile de repertoires"
      usage: "dirs [-c]"
      options:
        - ["-c", "Effacer la pile de repertoires"]
      examples:
        - "dirs                 # Afficher la pile de repertoires actuelle"
        - "dirs -c              # Effacer la pile de repertoires"
      notes: "Affiche tous les repertoires actuellement presents dans la pile de navigation."

    help:
      title: "❓ Aide"
      description: "Afficher les commandes et fonctionnalites disponibles"
      usage: "help"
      options: []
      examples:
        - "help                 # Afficher l'aide generale"
      notes: "Fournit un apercu de toutes les commandes et fonctionnalites disponibles du shell."

    clear:
      title: "🧹 Effacer l'ecran"
      description: "Effacer l'ecran du terminal"
      usage: "clear"
      options: []
      examples:
        - "clear                # Effacer l'ecran du terminal"
      notes: "Equivalent a la commande Unix standard clear."

    exit:
      title: "🚪 Quitter le shell"
      description: "Quitter AI Shell"
      usage: "exit"
      options: []
      examples:
        - "exit                 # Quitter le shell"
        - "quit                 # Methode alternative pour quitter"
      notes: "Quitte proprement le shell en preservant les donnees de session."

    export:
      title: "🔧 Exporter les variables d'environnement"
      description: "Definir ou afficher les variables d'environnement avec attribut d'export"
      usage: "export [-fn] [name[=value] ...]\nexport -p"
      options:
        - ["-f", "Le nom fait reference a une fonction shell (non pris en charge)"]
        - ["-n", "Retirer l'attribut d'export de chaque nom"]
        - ["-p", "Afficher la liste de toutes les variables exportees"]
        - ["--", "Desactiver le traitement ulterieur des options"]
      examples:
        - "export PATH=/usr/local/bin:$PATH"
        - "export EDITOR=vim"
        - "export -n VAR  # Retirer l'attribut d'export de VAR"
        - "export -p      # Afficher toutes les variables exportees"
        - "export JAVA_HOME=\"/usr/lib/jvm/java-11-openjdk\""
        - "export -- -VAR  # Definir une variable nommee -VAR"
      notes: "Les variables d'environnement definies avec export sont transmises aux processus enfants."

    unset:
      title: "🗑️ Supprimer les variables d'environnement"
      description: "Supprimer les variables et fonctions du shell"
      usage: "unset [-f] [-v] [-n] [name ...]"
      options:
        - ["-f", "Chaque nom fait reference a une fonction shell (non pris en charge)"]
        - ["-v", "Chaque nom fait reference a une variable shell (par defaut)"]
        - ["-n", "Chaque nom fait reference a une reference de nom (non pris en charge)"]
        - ["--", "Desactiver le traitement ulterieur des options"]
      examples:
        - "unset TEMP_VAR"
        - "unset -v VAR1 VAR2"
        - "unset JAVA_HOME"
        - "unset -- -VAR  # Supprimer la variable nommee -VAR"
      notes: "Retire les variables de l'environnement du shell. Les variables inexistantes sont ignorees."

    pwd:
      title: "📍 Afficher le repertoire courant"
      description: "Afficher le repertoire de travail courant avec gestion des liens symboliques"
      usage: "pwd [-L|-P]"
      options:
        - ["-L", "Afficher le chemin logique (suivre les liens symboliques, par defaut)"]
        - ["-P", "Afficher le chemin physique (resoudre les liens symboliques)"]
      examples:
        - "pwd                  # Afficher le repertoire courant logique"
        - "pwd -L               # Afficher le chemin logique (respecte les liens symboliques)"
        - "pwd -P               # Afficher le chemin physique (resout les liens symboliques)"
      notes: "Le comportement par defaut affiche le chemin logique en respectant les liens symboliques."

    ";":
      title: "🤖 Assistant IA"
      description: "Poser une question a l'assistant IA"
      usage: "; <question>"
      options:
        - ["question", "Votre question pour l'assistant IA"]
      examples:
        - "; comment trouver de gros fichiers ?"
        - "; explique cette commande : ls -la"
        - "; suggere une meilleure facon de compresser des fichiers"
      notes: "L'assistant IA peut aider avec les explications de commandes, les suggestions et l'usage general du shell."

    "；":
      title: "🤖 Assistant IA"
      description: "Poser une question a l'assistant IA"
      usage: "； <question>"
      options:
        - ["question", "Votre question pour l'assistant IA"]
      examples:
        - "； comment trouver de gros fichiers ?"
        - "； explique cette commande : ls -la"
        - "； suggere une meilleure facon de compresser des fichiers"
      notes: "L'assistant IA peut aider avec les explications de commandes, les suggestions et l'usage general du shell."

    "/model":
      title: "🧠 Changer de modele"
      description: "Afficher le modele actuel ou passer a un modele specifie"
      usage: "/model [model]"
      options:
        - ["model", "Identifiant du modele cible (verifie pour la prise en charge des appels d'outils)"]
        - ["--help, -h", "Afficher ce message d'aide"]
      examples:
        - "/model               # Afficher le modele actuel"
        - "/model gpt-4         # Passer a un modele"
        - "/model --help        # Afficher l'aide"
      notes: "Le changement verifie la connectivite et la prise en charge des appels d'outils ; en cas d'echec, le modele actuel est conserve."

    "/setup":
      title: "⚙️ Reconfigurer"
      description: "Relancer l'assistant de configuration interactif pour modifier les parametres d'API (fournisseur, cle API, modele)"
      usage: "/setup"
      options:
        - ["--help, -h", "Afficher ce message d'aide"]
      examples:
        - "/setup               # Lancer l'assistant de configuration"
        - "/setup --help        # Afficher l'aide"
      notes: "Les nouveaux parametres sont appliques immediatement sans redemarrage. Une annulation conserve la configuration actuelle."

