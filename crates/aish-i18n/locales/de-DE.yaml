help:
  labels:
    usage: "Verwendung"
    options: "Optionen"
    examples: "Beispiele"
    notes: "Hinweise"
    brief_usage: "Verwendung: {usage}"
  general:
    title: "AI Shell Hilfe"
    markdown: |-
      ## Schnellstart
      - **Shell-Befehle** — direkt eingeben: `ls`, `cd`, `vim`, `ssh`, `top` …
      - **KI fragen** — mit `;` beginnen: `;wie finde ich große Dateien`
      - **Slash-Befehle** — `/` in leerer Zeile drückt für interaktive Auswahl

      ## Slash-Befehle
      | Befehl | Beschreibung |
      |--------|--------------|
      | `/help [page]` | Hilfe anzeigen (`/help` für Seiten) |
      | `/quit` | AI Shell beenden |
      | `/model [Name]` | KI-Modell anzeigen oder wechseln |
      | `/setup` | API-Einstellungen neu konfigurieren |
      | `/plan [start\|status\|exit]` | Planmodus steuern |
      | `/token` | Token-Nutzung anzeigen (letzte 7 Tage) |
      | `/resume [id]` | Vorherige Sitzung fortsetzen |
      | `/feedback` | Feedback geben oder Fehler melden |

      ## Konfiguration
      - Konfigurationsdatei: `~/.config/aish/config.yaml`
      - Priorität: CLI-Argumente > Umgebungsvariablen (`AISH_MODEL`, `AISH_API_KEY`, `AISH_API_BASE`) > Konfigurationsdatei
      - `/setup` oder `aish setup` für interaktive Konfiguration

      ## Tastenkombinationen
      | Taste | Aktion |
      |-------|--------|
      | `Ctrl+C` | Aktuellen Vorgang abbrechen (zweimal zum Beenden) |
      | `Ctrl+D` | Shell beenden |
      | `Shift+Tab` / `F2` | Planmodus umschalten |
      | `Ctrl+O` | Ausgabeverlauf durchsuchen |
      | `/` in leerer Zeile | Slash-Befehlsauswahl |

      ## Hilfeseiten
      `/help <page>` für Details zu aish-spezifischen Funktionen:

      | Seite | Inhalt |
      |-------|--------|
      | `ai` | KI-Assistent (`;`-Präfix, Kontext, Gespräch) |
      | `model` | Modellverwaltung (anzeigen, wechseln, Anbieter) |
      | `plan` | Planmodus (Workflow, Genehmigung, vs. Normalmodus) |
      | `config` | Konfiguration (Dateien, Umgebungsvariablen, Priorität) |
      | `shortcuts` | Tastenkombinationen (Bearbeitung, Steuerung, Moduswechsel) |
      | `security` | Sicherheitsrichtlinie (Risikostufen, Regeln, Erkennung) |

      ## Mehr
      - Sicherheitsrichtlinie: `~/.config/aish/security_policy.yaml`
      - Sitzungsdaten: `~/.local/share/aish/sessions.db`
      - Protokolle: `~/.config/aish/logs/aish.log`
      - Dokumentation: https://github.com/AI-Shell-Team/aish

  topics:
    unknown: "Unbekannte Hilfeseite '{topic}'. Verfügbare Seiten: ai, model, plan, config, shortcuts, security"

    ai:
      title: "KI-Assistent"
      markdown: |-
        ## KI fragen

        Stellen Sie Ihre Frage mit `;` (Semikolon) oder `；` (vollbreites Semikolon) als Präfix:

        ```
        ; Wie finde ich große Dateien?
        ; Erkläre diesen Befehl: ls -la
        ; Schlage eine bessere Komprimierungsmethode vor
        ```

        Die KI sieht Ihren Gesprächskontext, einschließlich vorheriger Shell-Befehle und KI-Antworten.

        ## Funktionsweise

        - Ihre Frage wird an das konfigurierte LLM-Modell gesendet
        - Die KI erhält den Gesprächsverlauf als Kontext
        - Antworten werden mit Syntaxhervorhebung und Tabellenformatierung angezeigt

        ## Kontextverwaltung

        - Der Gesprächsverlauf wird automatisch verwaltet
        - Bei Überschreitung des Token-Budgets wird der Kontext automatisch komprimiert
        - Ältere Nachrichten werden zusammengefasst, um den aktuellen Kontext zu erhalten

    model:
      title: "Modellverwaltung"
      markdown: |-
        ## Modell anzeigen & wechseln

        ```
        /model                    # Aktuelles Modell anzeigen
        /model gpt-4o             # Zu GPT-4o wechseln
        /model claude-sonnet-4-6  # Zu Claude wechseln
        ```

        ## Unterstützte Anbieter

        | Anbieter | Modellpräfix |
        |----------|-------------|
        | OpenAI | `gpt-*`, `o1-*`, `o3-*`, `o4-*` |
        | Anthropic | `claude-*` |
        | Google | `gemini-*`, `gemma-*` |
        | DeepSeek | `deepseek-*` |
        | Qwen | `qwen-*`, `qwq-*` |
        | Mistral | `mistral-*`, `mixtral-*`, `codestral-*` |
        | xAI | `grok-*` |
        | Moonshot | `kimi-*`, `moonshot-*` |
        | Zhipu | `glm-*` |
        | Lokal | Ollama, vLLM, lokale API |

        ## Wechselverhalten

        - Anbieter wird automatisch anhand des Modellnamens erkannt
        - Konnektivität wird vor dem Wechsel überprüft
        - Bei Fehler bleibt das aktuelle Modell bestehen
        - Konfiguration wird automatisch in `~/.config/aish/config.yaml` gespeichert

    plan:
      title: "Planmodus"
      markdown: |-
        ## Was ist der Planmodus?

        Im Planmodus analysiert die KI Ihre Codebasis und erstellt einen detaillierten Implementierungsplan, bevor Code geschrieben wird. Änderungen werden erst nach Ihrer Genehmigung angewendet.

        ## Befehle

        ```
        /plan start     # Planmodus starten
        /plan status    # Aktuellen Planstatus anzeigen
        /plan exit      # Planmodus beenden
        ```

        Sie können den Planmodus auch mit `Shift+Tab` oder `F2` umschalten.

        ## Verwendung

        1. Planmodus starten: `/plan start`
        2. KI um Plan bitten: `; Auth-Modul auf JWT umstellen`
        3. KI erstellt einen Plan mit Schritten und Dateiänderungen
        4. Plan prüfen und jeden Schritt genehmigen oder ablehnen
        5. Nach Genehmigung werden Änderungen angewendet
        6. Planmodus beenden: `/plan exit`

        ## Planmodus vs. Normalmodus

        | | Normalmodus | Planmodus |
        |---|---|---|
        | KI-Tools | Voller Zugriff | Schreibgeschützt + Plan erstellen |
        | Codeänderungen | Sofort | Nach Genehmigung |
        | Geeignet für | Schnelle Fixes, Fragen | Refactoring, neue Funktionen |

    config:
      title: "Konfiguration"
      markdown: |-
        ## Konfigurationsdatei

        Speicherort: `~/.config/aish/config.yaml`

        Kann mit `$AISH_CONFIG_DIR` oder `$XDG_CONFIG_HOME` überschrieben werden.

        ## Priorität

        Kommandozeilenargumente > Umgebungsvariablen > Konfigurationsdatei

        ## Umgebungsvariablen

        | Variable | Zweck |
        |----------|-------|
        | `AISH_MODEL` | Standardmodell überschreiben |
        | `AISH_API_KEY` | API-Schlüssel überschreiben |
        | `AISH_API_BASE` | API-Basis-URL überschreiben |
        | `AISH_CONFIG_DIR` | Konfigurationsverzeichnis überschreiben |

        ## Wichtige Einstellungen

        ```
        model: gpt-4o                    # Standard-KI-Modell
        api_key: sk-xxx                  # API-Schlüssel
        api_base: https://api.openai.com/v1  # API-Endpunkt
        temperature: 0.3                 # Antwort-Zufälligkeit
        theme: dark                      # UI-Theme (dark/light)
        output_language: de              # Ausgabesprache erzwingen
        ```

        ## Einrichtungsassistent

        `/setup` oder `aish setup` für interaktive Konfiguration. Einstellungen werden sofort ohne Neustart wirksam.

        ## Weitere Dateien

        - Sicherheitsrichtlinie: `~/.config/aish/security_policy.yaml`
        - Sitzungsdatenbank: `~/.local/share/aish/sessions.db`
        - Protokolle: `~/.config/aish/logs/aish.log`

    shortcuts:
      title: "Tastenkombinationen"
      markdown: |-
        ## Bearbeitung

        | Taste | Aktion |
        |-------|--------|
        | `Tab` | Autovervollständigung |
        | `↑` / `↓` | Verlauf navigieren |
        | `Ctrl+R` | Verlauf durchsuchen |
        | `Ctrl+L` | Bildschirm löschen |
        | `Backspace` / `Delete` | Zeichen löschen |

        ## Shell-Steuerung

        | Taste | Aktion |
        |-------|--------|
        | `Ctrl+C` | Aktuelle Operation abbrechen (zweimal drücken zum Beenden) |
        | `Ctrl+D` | Shell beenden |
        | `Ctrl+O` | Ausgabeverlauf durchsuchen |
        | `Esc` | Aktuelle Eingabe abbrechen |

        ## Moduswechsel

        | Taste | Aktion |
        |-------|--------|
        | `Shift+Tab` / `F2` | Planmodus umschalten |
        | `/` in leerer Zeile | Slash-Befehlsauswahl öffnen |

    security:
      title: "Sicherheitsrichtlinie"
      markdown: |-
        ## Übersicht

        aish verwendet eine Sicherheitsrichtlinie, um zu steuern, welche Befehle und Dateioperationen eine Bestätigung erfordern oder blockiert werden.

        ## Speicherort

        Priorität:
        1. Explizit angegebener Pfad
        2. `/etc/aish/security_policy.yaml`
        3. `~/.config/aish/security_policy.yaml`

        ## Risikostufen

        | Stufe | Verhalten |
        |-------|-----------|
        | `LOW` | Erlaubt, protokolliert |
        | `MEDIUM` | Bestätigung erforderlich |
        | `HIGH` | Blockiert oder erfordert explizite Bestätigung |

        ## Regelstruktur

        ```yaml
        rules:
          - id: protect-system
            name: Systemverzeichnisse schützen
            path: ["/boot/**", "/etc/passwd"]
            operations: [WRITE, DELETE]
            risk: HIGH
            reason: "Systemdateien sollten nicht geändert werden"
        ```

        ## Pfadmuster

        - `*` passt auf ein einzelnes Pfadsegment
        - `**` passt auf null oder mehr Pfadsegmente
        - Variablen: `$HOME`, `$PWD`

        ## Geheimnisserkennung

        Eingebaute Erkennungsmuster für API-Schlüssel (OpenAI, Anthropic, AWS, Google, GitHub, Stripe, Slack), JWT-Token und URLs mit eingebetteten Passwörtern. Benutzerdefinierte Muster über `secret_patterns` möglich.

  command:
    history:
      title: "📚 Verlauf"
      description: "Befehlsverlauf anzeigen oder bearbeiten"
      usage: "history [options] [n]"
      options:
        - ["--help, -h", "Diese Hilfe anzeigen"]
        - ["-c", "Die Verlaufsliste leeren, indem alle Einträge gelöscht werden"]
        - ["-d offset", "Den Verlaufseintrag an Position offset löschen"]
        - ["n", "Nur die letzten n Befehle anzeigen"]
      examples:
        - "history              # Gesamten Befehlsverlauf anzeigen"
        - "history 10           # Die letzten 10 Befehle anzeigen"
        - "history -c           # Gesamten Verlauf löschen"
        - "history -d 5         # Verlaufseintrag an Position 5 löschen"
        - "history --help       # Diese Hilfe anzeigen"
      notes: "Verlaufseinträge werden für alle ausgeführten Befehle und KI-Interaktionen automatisch aufgezeichnet."

    cd:
      title: "📁 Verzeichnis wechseln"
      description: "Das aktuelle Arbeitsverzeichnis mit vollständiger Parameterunterstützung ändern"
      usage: "cd [-L|[-P [-e]]] [directory]"
      options:
        - ["-L", "Symbolische Links verfolgen: Symlinks nach der Verarbeitung von '..' auflösen (Standard)"]
        - ["-P", "Physische Verzeichnisstruktur ohne Verfolgen symbolischer Links verwenden: Symlinks vor der Verarbeitung von '..' auflösen"]
        - ["-e", "Falls -P angegeben ist und das aktuelle Arbeitsverzeichnis nicht ermittelt werden kann, mit einem Fehlerstatus beenden"]
        # - ["-@", "Auf Systemen mit Unterstützung Dateien mit erweiterten Attributen als Attribut-Verzeichnisse darstellen"]
        - ["directory", "Zielpfad des Verzeichnisses (optional, standardmäßig das Home-Verzeichnis)"]
        - ["-", "Zum vorherigen Verzeichnis zurückkehren"]
      examples:
        - "cd ~                 # Zum Home-Verzeichnis wechseln"
        - "cd /tmp              # In das Verzeichnis /tmp wechseln"
        - "cd -                 # Zum vorherigen Verzeichnis zurückkehren"
        - "cd \"path with spaces\" # Anführungszeichen für Pfade mit Leerzeichen verwenden"
        - "cd -P /tmp           # Physische Pfadauflösung verwenden"
        - "cd -P -e /tmp        # Physische Pfadauflösung verwenden und bei Fehler abbrechen"
        - "cd -L /tmp           # Symbolische Links verfolgen (Standardverhalten)"
        # - "cd -@ /tmp           # Erweiterte Attribute anzeigen (falls unterstützt)"
      notes: "Unterstützt Tab-Vervollständigung und den Umgang mit Pfaden mit Sonderzeichen. Das Standardverhalten folgt symbolischen Links (-L)."

    pushd:
      title: "📤 Verzeichnis auf Stack legen"
      description: "Ein Verzeichnis auf den Stack legen und dorthin wechseln"
      usage: "pushd [directory]"
      options:
        - ["directory", "Zielpfad des Verzeichnisses"]
        - ["(no args)", "Die obersten zwei Verzeichnisse auf dem Stack tauschen"]
      examples:
        - "pushd /tmp           # Aktuelles Verzeichnis auf den Stack legen und nach /tmp wechseln"
        - "pushd                # Zwischen aktuellem und vorherigem Verzeichnis wechseln"
      notes: "Pflegt einen Verzeichnis-Stack für eine einfache Navigation zwischen mehreren Verzeichnissen."

    popd:
      title: "📥 Verzeichnis vom Stack holen"
      description: "Ein Verzeichnis vom Stack nehmen und dorthin wechseln"
      usage: "popd"
      options: []
      examples:
        - "popd                 # Zum vorherigen Verzeichnis vom Stack zurückkehren"
      notes: "Entfernt das oberste Verzeichnis vom Stack und wechselt dorthin."

    dirs:
      title: "📋 Verzeichnis-Stack anzeigen"
      description: "Den Verzeichnis-Stack anzeigen"
      usage: "dirs [-c]"
      options:
        - ["-c", "Den Verzeichnis-Stack leeren"]
      examples:
        - "dirs                 # Aktuellen Verzeichnis-Stack anzeigen"
        - "dirs -c              # Verzeichnis-Stack leeren"
      notes: "Zeigt alle Verzeichnisse an, die sich aktuell auf dem Navigations-Stack befinden."

    help:
      title: "❓ Hilfe"
      description: "Verfügbare Befehle und Funktionen anzeigen"
      usage: "help"
      options: []
      examples:
        - "help                 # Allgemeine Hilfe anzeigen"
      notes: "Gibt einen Überblick über alle verfügbaren Befehle und Shell-Funktionen."

    clear:
      title: "🧹 Bildschirm leeren"
      description: "Den Terminalbildschirm leeren"
      usage: "clear"
      options: []
      examples:
        - "clear                # Den Terminalbildschirm leeren"
      notes: "Entspricht dem standardmäßigen Unix-Befehl clear."

    exit:
      title: "🚪 Shell beenden"
      description: "Die AI Shell beenden"
      usage: "exit"
      options: []
      examples:
        - "exit                 # Die Shell beenden"
        - "quit                 # Alternative Methode zum Beenden"
      notes: "Beendet die Shell sauber und bewahrt Sitzungsdaten."

    export:
      title: "🔧 Umgebungsvariablen exportieren"
      description: "Umgebungsvariablen mit Export-Attribut setzen oder anzeigen"
      usage: "export [-fn] [name[=value] ...]\nexport -p"
      options:
        - ["-f", "Name verweist auf eine Shell-Funktion (nicht unterstützt)"]
        - ["-n", "Export-Attribut von jedem Namen entfernen"]
        - ["-p", "Liste aller exportierten Variablen anzeigen"]
        - ["--", "Weitere Optionsverarbeitung deaktivieren"]
      examples:
        - "export PATH=/usr/local/bin:$PATH"
        - "export EDITOR=vim"
        - "export -n VAR  # Export-Attribut von VAR entfernen"
        - "export -p      # Alle exportierten Variablen anzeigen"
        - "export JAVA_HOME=\"/usr/lib/jvm/java-11-openjdk\""
        - "export -- -VAR  # Variable mit dem Namen -VAR setzen"
      notes: "Mit export gesetzte Umgebungsvariablen werden an Kindprozesse weitergegeben."

    unset:
      title: "🗑️ Umgebungsvariablen entfernen"
      description: "Shell-Variablen und Funktionen entfernen"
      usage: "unset [-f] [-v] [-n] [name ...]"
      options:
        - ["-f", "Jeder Name verweist auf eine Shell-Funktion (nicht unterstützt)"]
        - ["-v", "Jeder Name verweist auf eine Shell-Variable (Standard)"]
        - ["-n", "Jeder Name verweist auf eine Namensreferenz (nicht unterstützt)"]
        - ["--", "Weitere Optionsverarbeitung deaktivieren"]
      examples:
        - "unset TEMP_VAR"
        - "unset -v VAR1 VAR2"
        - "unset JAVA_HOME"
        - "unset -- -VAR  # Variable mit dem Namen -VAR entfernen"
      notes: "Entfernt Variablen aus der Shell-Umgebung. Nicht vorhandene Variablen werden ignoriert."

    pwd:
      title: "📍 Arbeitsverzeichnis ausgeben"
      description: "Das aktuelle Arbeitsverzeichnis mit Symlink-Behandlung ausgeben"
      usage: "pwd [-L|-P]"
      options:
        - ["-L", "Logischen Pfad anzeigen (Symlinks folgen, Standard)"]
        - ["-P", "Physischen Pfad anzeigen (Symlinks auflösen)"]
      examples:
        - "pwd                  # Logisches aktuelles Verzeichnis anzeigen"
        - "pwd -L               # Logischen Pfad anzeigen (Symlinks beachten)"
        - "pwd -P               # Physischen Pfad anzeigen (Symlinks auflösen)"
      notes: "Das Standardverhalten zeigt den logischen Pfad an und berücksichtigt symbolische Links."

    ";":
      title: "🤖 KI-Assistent"
      description: "Dem KI-Assistenten eine Frage stellen"
      usage: "; <question>"
      options:
        - ["question", "Ihre Frage an den KI-Assistenten"]
      examples:
        - "; wie finde ich große Dateien?"
        - "; erkläre diesen Befehl: ls -la"
        - "; schlage eine bessere Methode zum Komprimieren von Dateien vor"
      notes: "Der KI-Assistent kann bei Befehlserklärungen, Vorschlägen und allgemeiner Shell-Nutzung helfen."

    "；":
      title: "🤖 KI-Assistent"
      description: "Dem KI-Assistenten eine Frage stellen"
      usage: "； <question>"
      options:
        - ["question", "Ihre Frage an den KI-Assistenten"]
      examples:
        - "； wie finde ich große Dateien?"
        - "； erkläre diesen Befehl: ls -la"
        - "； schlage eine bessere Methode zum Komprimieren von Dateien vor"
      notes: "Der KI-Assistent kann bei Befehlserklärungen, Vorschlägen und allgemeiner Shell-Nutzung helfen."

    "/model":
      title: "🧠 Modell wechseln"
      description: "Das aktuelle Modell anzeigen oder zu einem angegebenen Modell wechseln"
      usage: "/model [model]"
      options:
        - ["model", "Zielmodellkennung (wird auf Tool-Call-Unterstützung geprüft)"]
        - ["--help, -h", "Diese Hilfe anzeigen"]
      examples:
        - "/model               # Aktuelles Modell anzeigen"
        - "/model gpt-4         # Zu einem Modell wechseln"
        - "/model --help        # Hilfe anzeigen"
      notes: "Beim Wechsel werden Konnektivität und Tool-Call-Unterstützung geprüft; bei Fehlern bleibt das aktuelle Modell erhalten."

    "/setup":
      title: "⚙️ Neu konfigurieren"
      description: "Den interaktiven Einrichtungsassistenten erneut ausführen, um API-Einstellungen zu ändern (Provider, API-Key, Modell)"
      usage: "/setup"
      options:
        - ["--help, -h", "Diese Hilfe anzeigen"]
      examples:
        - "/setup               # Einrichtungsassistent starten"
        - "/setup --help        # Hilfe anzeigen"
