help:
  labels:
    usage: "用法"
    options: "选项"
    examples: "示例"
    notes: "说明"
    brief_usage: "用法：{usage}"

  general:
    title: "AI Shell 帮助"
    markdown: |-
      ## 快速开始
      - **Shell 命令** — 直接输入：`ls`、`cd`、`vim`、`ssh`、`top` …
      - **向 AI 提问** — 以 `;` 或 `；` 开头：`;如何查找大文件`
      - **斜杠命令** — 在空行按 `/` 打开交互式选择器

      ## 斜杠命令
      | 命令 | 说明 |
      |------|------|
      | `/help [page]` | 显示帮助（`/help` 查看可用页面） |
      | `/quit` | 退出 AI Shell |
      | `/model [名称]` | 查看或切换 AI 模型 |
      | `/setup` | 重新配置 API 设置 |
      | `/plan [start\|status\|exit]` | 计划模式控制 |
      | `/token` | 显示令牌用量（近 7 天） |
      | `/resume [id]` | 恢复之前的会话 |
      | `/feedback` | 提交反馈或报告问题 |
      | `/record start\|stop` | 录制终端会话 (asciinema 格式) |

      ```
      /record start         # 开始录制
      /record stop          # 停止并保存录制
      ```

      ## 配置
      - 配置文件：`~/.config/aish/config.yaml`
      - 优先级：命令行参数 > 环境变量（`AISH_MODEL`、`AISH_API_KEY`、`AISH_API_BASE`） > 配置文件
      - 运行 `/setup` 或 `aish setup` 进行交互式配置

      ## 快捷键
      | 按键 | 功能 |
      |------|------|
      | `Ctrl+C` | 取消当前操作（连按两次退出） |
      | `Ctrl+D` | 退出 Shell |
      | `Shift+Tab` / `F2` | 切换计划模式 |
      | `Ctrl+O` | 浏览输出历史 |
      | 空行按 `/` | 斜杠命令选择器 |

      ## 帮助页面
      使用 `/help <page>` 查看 aish 特有功能的详细说明：

      | 页面 | 内容 |
      |------|------|
      | `ai` | AI 助手用法（`;` 前缀、上下文、对话） |
      | `model` | 模型管理（查看、切换、支持供应商） |
      | `plan` | 计划模式（工作流、审批、与普通模式对比） |
      | `config` | 配置（文件、环境变量、优先级） |
      | `shortcuts` | 快捷键（编辑、控制、模式切换） |
      | `security` | 安全策略（风险等级、规则、密钥检测） |

      ## 更多
      - 安全策略：`~/.config/aish/security_policy.yaml`
      - 会话数据：`~/.local/share/aish/sessions.db`
      - 日志：`~/.config/aish/logs/aish.log`
      - 文档：https://github.com/AI-Shell-Team/aish

  topics:
    unknown: "未知帮助页面 '{topic}'。可用页面：ai, model, plan, config, shortcuts, security"

    ai:
      title: "AI 助手"
      markdown: |-
        ## 向 AI 提问

        在问题前加 `;`（半角分号）或 `；`（全角分号）：

        ```
        ; 如何查找大文件？
        ; 解释这个命令：ls -la
        ; 推荐一个更好的压缩方式
        ```

        AI 会看到你的对话上下文，包括之前的 shell 命令和 AI 回复。

        ## 工作原理

        - 你的问题会发送到配置的 LLM 模型
        - AI 接收对话历史作为上下文
        - 回复支持语法高亮和表格渲染

        ## 上下文管理

        - 对话历史自动维护
        - 超出 token 预算时自动压缩上下文
        - 旧消息被摘要化，保留近期上下文

    model:
      title: "模型管理"
      markdown: |-
        ## 查看 & 切换模型

        ```
        /model                    # 查看当前模型
        /model gpt-4o             # 切换到 GPT-4o
        /model claude-sonnet-4-6  # 切换到 Claude
        ```

        ## 支持的供应商

        | 供应商 | 模型前缀 |
        |--------|----------|
        | OpenAI | `gpt-*`, `o1-*`, `o3-*`, `o4-*` |
        | Anthropic | `claude-*` |
        | Google | `gemini-*`, `gemma-*` |
        | DeepSeek | `deepseek-*` |
        | 通义千问 | `qwen-*`, `qwq-*` |
        | Mistral | `mistral-*`, `mixtral-*`, `codestral-*` |
        | xAI | `grok-*` |
        | Moonshot | `kimi-*`, `moonshot-*` |
        | 智谱 | `glm-*` |
        | 本地 | Ollama、vLLM、本地 API |

        ## 切换行为

        - 根据模型名自动检测供应商
        - 切换前验证连接性
        - 失败时保留当前模型
        - 配置自动保存到 `~/.config/aish/config.yaml`

    plan:
      title: "计划模式"
      markdown: |-
        ## 什么是计划模式？

        计划模式让 AI 在写代码之前先分析代码库并创建详细的实施计划。只有在审批通过后才会应用更改。

        ## 命令

        ```
        /plan start     # 进入计划模式
        /plan status    # 查看当前计划状态
        /plan exit      # 退出计划模式
        ```

        也可以用 `Shift+Tab` 或 `F2` 切换计划模式。

        ## 使用流程

        1. 进入计划模式：`/plan start`
        2. 让 AI 规划：`; 重构 auth 模块使用 JWT`
        3. AI 生成包含步骤和文件变更的计划
        4. 审核计划，逐步批准或拒绝
        5. 审批通过后应用更改
        6. 退出计划模式：`/plan exit`

        ## 计划模式 vs 普通模式

        | | 普通模式 | 计划模式 |
        |---|---|---|
        | AI 工具 | 完整访问 | 只读 + 计划写入 |
        | 代码变更 | 立即执行 | 审批后执行 |
        | 适合场景 | 快速修复、提问 | 重构、新功能 |

    config:
      title: "配置"
      markdown: |-
        ## 配置文件

        位置：`~/.config/aish/config.yaml`

        可通过 `$AISH_CONFIG_DIR` 或 `$XDG_CONFIG_HOME` 覆盖。

        ## 优先级

        命令行参数 > 环境变量 > 配置文件

        ## 环境变量

        | 变量 | 用途 |
        |------|------|
        | `AISH_MODEL` | 覆盖默认模型 |
        | `AISH_API_KEY` | 覆盖 API 密钥 |
        | `AISH_API_BASE` | 覆盖 API 地址 |
        | `AISH_CONFIG_DIR` | 覆盖配置目录 |

        ## 主要设置

        ```
        model: gpt-4o                    # 默认 LLM 模型
        api_key: sk-xxx                  # API 密钥
        api_base: https://api.openai.com/v1  # API 端点
        temperature: 0.3                 # 回复随机性
        theme: dark                      # UI 主题（dark/light）
        output_language: zh              # 强制输出语言
        ```

        ## 配置向导

        运行 `/setup` 或 `aish setup` 进行交互式配置。设置立即生效，无需重启。

        ## 其他文件

        - 安全策略：`~/.config/aish/security_policy.yaml`
        - 会话数据库：`~/.local/share/aish/sessions.db`
        - 日志：`~/.config/aish/logs/aish.log`

    shortcuts:
      title: "快捷键"
      markdown: |-
        ## 编辑

        | 按键 | 功能 |
        |------|------|
        | `Tab` | 自动补全 |
        | `↑` / `↓` | 浏览历史 |
        | `Ctrl+R` | 搜索历史 |
        | `Ctrl+L` | 清屏 |
        | `Backspace` / `Delete` | 删除字符 |

        ## Shell 控制

        | 按键 | 功能 |
        |------|------|
        | `Ctrl+C` | 取消当前操作（连按两次退出） |
        | `Ctrl+D` | 退出 Shell |
        | `Ctrl+O` | 浏览输出历史 |
        | `Esc` | 取消当前输入 |

        ## 模式切换

        | 按键 | 功能 |
        |------|------|
        | `Shift+Tab` / `F2` | 切换计划模式 |
        | 空行按 `/` | 打开斜杠命令选择器 |

    security:
      title: "安全策略"
      markdown: |-
        ## 概述

        aish 使用安全策略文件来控制哪些命令和文件操作需要确认或被阻止。

        ## 配置位置

        优先级：
        1. 显式指定的路径
        2. `/etc/aish/security_policy.yaml`
        3. `~/.config/aish/security_policy.yaml`

        ## 风险等级

        | 等级 | 行为 |
        |------|------|
        | `LOW` | 允许，记录日志 |
        | `MEDIUM` | 需要确认 |
        | `HIGH` | 阻止或需要明确确认 |

        ## 规则结构

        ```yaml
        rules:
          - id: protect-system
            name: 保护系统目录
            path: ["/boot/**", "/etc/passwd"]
            operations: [WRITE, DELETE]
            risk: HIGH
            reason: "不应修改系统文件"
        ```

        ## 路径模式

        - `*` 匹配单个路径段
        - `**` 匹配零或多个路径段
        - 变量：`$HOME`、`$PWD`

        ## 密钥检测

        内置 API 密钥检测模式（OpenAI、Anthropic、AWS、Google、GitHub、Stripe、Slack）、JWT 令牌和嵌入密码的 URL。支持通过 `secret_patterns` 添加自定义模式。

  command:
    history:
      title: "📚 history 命令"
      description: "显示或管理命令历史"
      usage: "history [options] [n]"
      options:
        - ["--help, -h", "显示本帮助信息"]
        - ["-c", "删除所有条目并清空历史列表"]
        - ["-d offset", "删除指定位置 offset 的历史条目"]
        - ["n", "仅显示最近 n 条命令"]
      examples:
        - "history              # 显示全部命令历史"
        - "history 10           # 显示最近 10 条命令"
        - "history -c           # 清空历史"
        - "history -d 5         # 删除第 5 条历史"
        - "history --help       # 显示本帮助信息"
      notes: "所有已执行命令与 AI 交互都会自动记录到历史中。"

    cd:
      title: "📁 cd 切换目录"
      description: "切换当前工作目录(完整参数支持)"
      usage: "cd [-L|[-P [-e]]] [directory]"
      options:
        - ["-L", "强制跟随符号链接：在处理 '..' 后再解析符号链接(默认)"]
        - ["-P", "使用物理目录结构：在处理 '..' 前解析符号链接"]
        - ["-e", "当指定 -P 且无法确定当前目录时，以非 0 状态退出"]
        # - ["-@", "在支持的系统上，将带扩展属性的文件视为包含属性的目录"]
        - ["directory", "目标目录路径(可选，默认回到 home 目录)"]
        - ["-", "返回上一个目录"]
      examples:
        - "cd ~                 # 切换到 home 目录"
        - "cd /tmp              # 切换到 /tmp"
        - "cd -                 # 返回上一个目录"
        - "cd \"path with spaces\" # 路径含空格时使用引号"
        - "cd -P /tmp           # 使用物理路径解析"
        - "cd -P -e /tmp        # 使用物理路径解析，出错则退出"
        - "cd -L /tmp           # 强制跟随符号链接(默认行为)"
        # - "cd -@ /tmp           # 显示扩展属性(若支持)"
      notes: "支持 tab 补全与特殊字符路径处理；默认行为为 -L(跟随符号链接)。"

    pushd:
      title: "📤 pushd 目录入栈"
      description: "将目录压入栈并切换到该目录"
      usage: "pushd [directory]"
      options:
        - ["directory", "目标目录路径"]
        - ["(no args)", "交换目录栈顶的两个目录"]
      examples:
        - "pushd /tmp           # 将当前目录入栈并切换到 /tmp"
        - "pushd                # 在当前目录与上一个目录间切换"
      notes: "维护目录栈，便于在多个目录间快速切换。"

    popd:
      title: "📥 popd 目录出栈"
      description: "弹出目录栈并切换到该目录"
      usage: "popd"
      options: []
      examples:
        - "popd                 # 从目录栈返回上一个目录"
      notes: "移除目录栈顶目录并切换到新的栈顶目录。"

    dirs:
      title: "📋 dirs 显示目录栈"
      description: "显示当前目录栈"
      usage: "dirs [-c]"
      options:
        - ["-c", "清空目录栈"]
      examples:
        - "dirs                 # 显示当前目录栈"
        - "dirs -c              # 清空目录栈"
      notes: "显示当前导航目录栈中的所有目录。"

    help:
      title: "❓ help 帮助"
      description: "显示可用命令与功能概览"
      usage: "help"
      options: []
      examples:
        - "help                 # 显示通用帮助信息"
      notes: "提供所有可用命令与 shell 功能的概览。"

    clear:
      title: "🧹 clear 清屏"
      description: "清空终端屏幕"
      usage: "clear"
      options: []
      examples:
        - "clear                # 清空终端屏幕"
      notes: "等同于标准 Unix 的 clear 命令。"

    exit:
      title: "🚪 exit 退出"
      description: "退出 AI Shell"
      usage: "exit"
      options: []
      examples:
        - "exit                 # 退出 shell"
        - "quit                 # 也可以用 quit 退出"
      notes: "将会干净地退出 shell，并保留会话数据。"

    export:
      title: "🔧 export 导出环境变量"
      description: "设置或显示带 export 属性的环境变量"
      usage: "export [-fn] [name[=value] ...]\nexport -p"
      options:
        - ["-f", "名称指向 shell 函数(不支持)"]
        - ["-n", "移除每个名称的 export 属性"]
        - ["-p", "显示所有已导出的变量"]
        - ["--", "停止进一步的选项处理"]
      examples:
        - "export PATH=/usr/local/bin:$PATH"
        - "export EDITOR=vim"
        - "export -n VAR  # 移除 VAR 的 export 属性"
        - "export -p      # 显示所有已导出的变量"
        - "export JAVA_HOME=\"/usr/lib/jvm/java-11-openjdk\""
        - "export -- -VAR  # 设置名为 -VAR 的变量"
      notes: "通过 export 设置的环境变量会传递给子进程。"

    unset:
      title: "🗑️ unset 取消变量"
      description: "取消设置 shell 变量与函数"
      usage: "unset [-f] [-v] [-n] [name ...]"
      options:
        - ["-f", "名称指向 shell 函数(不支持)"]
        - ["-v", "名称指向 shell 变量(默认)"]
        - ["-n", "名称指向 name reference(不支持)"]
        - ["--", "停止进一步的选项处理"]
      examples:
        - "unset TEMP_VAR"
        - "unset -v VAR1 VAR2"
        - "unset JAVA_HOME"
        - "unset -- -VAR  # 取消名为 -VAR 的变量"
      notes: "从 shell 环境中移除变量；不存在的变量会被忽略。"

    pwd:
      title: "📍 pwd 显示当前目录"
      description: "显示当前工作目录(支持符号链接处理)"
      usage: "pwd [-L|-P]"
      options:
        - ["-L", "显示逻辑路径(跟随符号链接，默认)"]
        - ["-P", "显示物理路径(解析符号链接)"]
      examples:
        - "pwd                  # 显示逻辑当前目录"
        - "pwd -L               # 显示逻辑路径(遵循符号链接)"
        - "pwd -P               # 显示物理路径(解析符号链接)"
      notes: "默认行为显示逻辑路径，并尊重符号链接。"

    ";":
      title: "🤖 AI 助手"
      description: "向 AI 助手提问"
      usage: "; <question>"
      options:
        - ["question", "你要问 AI 的问题"]
      examples:
        - "; 如何查找大文件？"
        - "; 解释这个命令：ls -la"
        - "; 有什么更好的方式压缩文件？"
      notes: "AI 助手可用于命令解释、建议以及一般的 shell 使用帮助。"

    "；":
      title: "🤖 AI 助手"
      description: "向 AI 助手提问"
      usage: "； <question>"
      options:
        - ["question", "你要问 AI 的问题"]
      examples:
        - "； 如何查找大文件？"
        - "； 解释这个命令：ls -la"
        - "； 有什么更好的方式压缩文件？"
      notes: "AI 助手可用于命令解释、建议以及一般的 shell 使用帮助。"

    "/model":
      title: "🧠 model 切换模型"
      description: "显示当前模型或切换到指定模型"
      usage: "/model [模型名称]"
      options:
        - ["模型名称", "要切换到的模型标识(会进行 tool-call 能力验证)"]
        - ["--help, -h", "显示本帮助信息"]
      examples:
        - "/model               # 显示当前模型"
        - "/model gpt-4         # 切换到指定模型"
        - "/model --help        # 显示帮助"
      notes: "切换会进行连通性与工具调用能力验证；失败则不会切换。"

    "/setup":
      title: "⚙️ setup 重新配置"
      description: "重新运行交互式配置向导，更改 API 设置(Provider、API Key、模型)"
      usage: "/setup"
      options:
        - ["--help, -h", "显示本帮助信息"]
      examples:
        - "/setup               # 启动配置向导"
        - "/setup --help        # 显示帮助"
      notes: "配置完成后会自动应用新设置，无需重启。取消则保持当前配置不变。"

