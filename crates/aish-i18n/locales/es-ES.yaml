help:
  labels:
    usage: "Uso"
    options: "Opciones"
    examples: "Ejemplos"
    notes: "Notas"
    brief_usage: "Uso: {usage}"
  general:
    title: "Ayuda de AI Shell"
    markdown: |-
      ## Inicio rápido
      - **Comandos Shell** — escribe directamente: `ls`, `cd`, `vim`, `ssh`, `top` …
      - **Pregunta a la IA** — comienza con `;`: `;cómo encontrar archivos grandes`
      - **Comandos slash** — pulsa `/` en línea vacía para el selector interactivo

      ## Comandos Slash
      | Comando | Descripción |
      |---------|-------------|
      | `/help [page]` | Mostrar ayuda (`/help` para páginas) |
      | `/quit` | Salir de AI Shell |
      | `/model [nombre]` | Mostrar o cambiar el modelo de IA |
      | `/setup` | Reconfigurar ajustes de API |
      | `/plan [start\|status\|exit]` | Control del modo plan |
      | `/token` | Mostrar uso de tokens (últimos 7 días) |
      | `/resume [id]` | Reanudar sesión anterior |
      | `/feedback` | Enviar comentarios o reportar un bug |

      ## Configuración
      - Archivo de configuración: `~/.config/aish/config.yaml`
      - Prioridad: argumentos CLI > variables de entorno (`AISH_MODEL`, `AISH_API_KEY`, `AISH_API_BASE`) > archivo de config
      - Ejecuta `/setup` o `aish setup` para configuración interactiva

      ## Atajos de teclado
      | Tecla | Acción |
      |-------|--------|
      | `Ctrl+C` | Cancelar operación actual (dos veces para salir) |
      | `Ctrl+D` | Salir del shell |
      | `Shift+Tab` / `F2` | Alternar modo plan |
      | `Ctrl+O` | Navegar historial de salida |
      | `/` en línea vacía | Selector de comandos slash |

      ## Páginas de ayuda
      Use `/help <page>` para detalles sobre funciones específicas de aish:

      | Página | Contenido |
      |---------|-----------|
      | `ai` | Asistente de IA (prefijo `;`, contexto, conversación) |
      | `model` | Gestión de modelos (ver, cambiar, proveedores) |
      | `plan` | Modo plan (flujo, aprobación, vs modo normal) |
      | `config` | Configuración (archivos, variables, prioridad) |
      | `shortcuts` | Atajos de teclado (edición, control, cambio de modo) |
      | `security` | Política de seguridad (niveles, reglas, detección) |

      ## Más
      - Política de seguridad: `~/.config/aish/security_policy.yaml`
      - Datos de sesión: `~/.local/share/aish/sessions.db`
      - Registros: `~/.config/aish/logs/aish.log`
      - Documentación: https://github.com/AI-Shell-Team/aish

  topics:
    unknown: "Página de ayuda desconocida '{topic}'. Páginas disponibles: ai, model, plan, config, shortcuts, security"

    ai:
      title: "Asistente de IA"
      markdown: |-
        ## Preguntar a la IA

        Prefije su pregunta con `;` (punto y coma) o `；` (punto y coma ancho):

        ```
        ; ¿cómo encontrar archivos grandes?
        ; explica este comando: ls -la
        ; sugiere una mejor forma de comprimir archivos
        ```

        La IA ve el contexto de su conversación, incluidos los comandos de shell y respuestas anteriores.

        ## Cómo funciona

        - Su pregunta se envía al modelo LLM configurado
        - La IA recibe el historial de conversación como contexto
        - Las respuestas se muestran con resaltado de sintaxis y formato de tablas

        ## Gestión de contexto

        - El historial de conversación se mantiene automáticamente
        - La compactación automática se activa cuando se excede el presupuesto de tokens
        - Los mensajes antiguos se resumen para mantener el contexto reciente

    model:
      title: "Gestión de modelos"
      markdown: |-
        ## Ver y cambiar modelos

        ```
        /model                    # Mostrar modelo actual
        /model gpt-4o             # Cambiar a GPT-4o
        /model claude-sonnet-4-6  # Cambiar a Claude
        ```

        ## Proveedores compatibles

        | Proveedor | Prefijo del modelo |
        |-----------|-------------------|
        | OpenAI | `gpt-*`, `o1-*`, `o3-*`, `o4-*` |
        | Anthropic | `claude-*` |
        | Google | `gemini-*`, `gemma-*` |
        | DeepSeek | `deepseek-*` |
        | Qwen | `qwen-*`, `qwq-*` |
        | Mistral | `mistral-*`, `mixtral-*`, `codestral-*` |
        | xAI | `grok-*` |
        | Moonshot | `kimi-*`, `moonshot-*` |
        | Zhipu | `glm-*` |
        | Local | Ollama, vLLM, API local |

        ## Comportamiento al cambiar

        - El proveedor se detecta automáticamente por el nombre del modelo
        - Se valida la conectividad antes de cambiar
        - En caso de fallo, se mantiene el modelo actual
        - La configuración se guarda automáticamente en `~/.config/aish/config.yaml`

    plan:
      title: "Modo Plan"
      markdown: |-
        ## ¿Qué es el modo Plan?

        El modo Plan permite que la IA analice su base de código y cree un plan de implementación detallado antes de escribir código. Los cambios solo se aplican después de su aprobación.

        ## Comandos

        ```
        /plan start     # Entrar en modo plan
        /plan status    # Mostrar estado del plan actual
        /plan exit      # Salir del modo plan
        ```

        También puede alternar el modo plan con `Shift+Tab` o `F2`.

        ## Uso

        1. Entrar en modo plan：`/plan start`
        2. Pedir a la IA que planifique：`; refactorizar el módulo auth para usar JWT`
        3. La IA genera un plan con pasos y cambios de archivos
        4. Revisar el plan y aprobar o rechazar cada paso
        5. Una vez aprobado, se aplican los cambios
        6. Salir del modo plan：`/plan exit`

        ## Modo Plan vs Modo Normal

        | | Modo Normal | Modo Plan |
        |---|---|---|
        | Herramientas IA | Acceso completo | Solo lectura + escritura de plan |
        | Cambios de código | Inmediatos | Tras aprobación |
        | Ideal para | Correcciones rápidas, preguntas | Refactorizaciones, nuevas funciones |

    config:
      title: "Configuración"
      markdown: |-
        ## Archivo de configuración

        Ubicación：`~/.config/aish/config.yaml`

        Se puede sobrescribir con `$AISH_CONFIG_DIR` o `$XDG_CONFIG_HOME`.

        ## Prioridad

        Argumentos CLI > variables de entorno > archivo de configuración

        ## Variables de entorno

        | Variable | Propósito |
        |----------|-----------|
        | `AISH_MODEL` | Sobrescribir modelo predeterminado |
        | `AISH_API_KEY` | Sobrescribir clave API |
        | `AISH_API_BASE` | Sobrescribir URL base de API |
        | `AISH_CONFIG_DIR` | Sobrescribir directorio de configuración |

        ## Configuraciones principales

        ```
        model: gpt-4o                    # Modelo LLM predeterminado
        api_key: sk-xxx                  # Clave API
        api_base: https://api.openai.com/v1  # Endpoint de API
        temperature: 0.3                 # Aleatoriedad de respuestas
        theme: dark                      # Tema de UI (dark/light)
        output_language: es              # Forzar idioma de salida
        ```

        ## Asistente de configuración

        Ejecute `/setup` o `aish setup` para configuración interactiva. Los cambios se aplican inmediatamente sin reiniciar.

        ## Otros archivos

        - Política de seguridad：`~/.config/aish/security_policy.yaml`
        - Base de datos de sesiones：`~/.local/share/aish/sessions.db`
        - Registros：`~/.config/aish/logs/aish.log`

    shortcuts:
      title: "Atajos de teclado"
      markdown: |-
        ## Edición

        | Tecla | Acción |
        |-------|--------|
        | `Tab` | Autocompletar |
        | `↑` / `↓` | Navegar historial |
        | `Ctrl+R` | Buscar en historial |
        | `Ctrl+L` | Limpiar pantalla |
        | `Backspace` / `Delete` | Eliminar carácter |

        ## Control de Shell

        | Tecla | Acción |
        |-------|--------|
        | `Ctrl+C` | Cancelar operación actual (presionar dos veces para salir) |
        | `Ctrl+D` | Salir del shell |
        | `Ctrl+O` | Explorar historial de salida |
        | `Esc` | Cancelar entrada actual |

        ## Cambio de modo

        | Tecla | Acción |
        |-------|--------|
        | `Shift+Tab` / `F2` | Alternar modo plan |
        | `/` en línea vacía | Abrir selector de comandos |

    security:
      title: "Política de seguridad"
      markdown: |-
        ## Resumen

        aish usa un archivo de política de seguridad para controlar qué comandos y operaciones de archivos requieren confirmación o son bloqueados.

        ## Ubicación de configuración

        Prioridad：
        1. Ruta explícita especificada
        2. `/etc/aish/security_policy.yaml`
        3. `~/.config/aish/security_policy.yaml`

        ## Niveles de riesgo

        | Nivel | Comportamiento |
        |-------|---------------|
        | `LOW` | Permitido, registrado |
        | `MEDIUM` | Solicitar confirmación |
        | `HIGH` | Bloqueado o requiere confirmación explícita |

        ## Estructura de reglas

        ```yaml
        rules:
          - id: protect-system
            name: Proteger directorios del sistema
            path: ["/boot/**", "/etc/passwd"]
            operations: [WRITE, DELETE]
            risk: HIGH
            reason: "Los archivos del sistema no deben modificarse"
        ```

        ## Patrones de ruta

        - `*` coincide con un solo segmento de ruta
        - `**` coincide con cero o más segmentos de ruta
        - Variables：`$HOME`, `$PWD`

        ## Detección de secretos

        Patrones integrados para detectar claves API (OpenAI, Anthropic, AWS, Google, GitHub, Stripe, Slack), tokens JWT y URLs con contraseñas incrustadas. Patrones personalizados vía `secret_patterns`.

  command:
    history:
      title: "📚 Historial"
      description: "Mostrar o manipular el historial de comandos"
      usage: "history [options] [n]"
      options:
        - ["--help, -h", "Mostrar este mensaje de ayuda"]
        - ["-c", "Borrar la lista del historial eliminando todas las entradas"]
        - ["-d offset", "Eliminar la entrada del historial en la posición offset"]
        - ["n", "Mostrar solo los últimos n comandos"]
      examples:
        - "history              # Mostrar todo el historial de comandos"
        - "history 10           # Mostrar los últimos 10 comandos"
        - "history -c           # Borrar todo el historial"
        - "history -d 5         # Eliminar la entrada del historial en la posición 5"
        - "history --help       # Mostrar este mensaje de ayuda"
      notes: "Las entradas del historial se registran automáticamente para todos los comandos ejecutados y las interacciones con la IA."

    cd:
      title: "📁 Cambiar directorio"
      description: "Cambiar el directorio de trabajo actual con soporte completo de parámetros"
      usage: "cd [-L|[-P [-e]]] [directory]"
      options:
        - ["-L", "Forzar el seguimiento de enlaces simbólicos: resolver enlaces simbólicos después de procesar las apariciones de '..' (predeterminado)"]
        - ["-P", "Usar la estructura física de directorios sin seguir enlaces simbólicos: resolver enlaces simbólicos antes de procesar las apariciones de '..'"]
        - ["-e", "Si se proporciona la opción -P y no se puede determinar el directorio de trabajo actual, salir con un estado distinto de cero"]
        # - ["-@", "En sistemas compatibles, mostrar archivos con atributos extendidos como directorios que contienen atributos de archivo"]
        - ["directory", "Ruta del directorio de destino (opcional; por defecto, el directorio personal)"]
        - ["-", "Volver al directorio anterior"]
      examples:
        - "cd ~                 # Cambiar al directorio personal"
        - "cd /tmp              # Cambiar al directorio /tmp"
        - "cd -                 # Volver al directorio anterior"
        - "cd \"path with spaces\" # Usar comillas para rutas con espacios"
        - "cd -P /tmp           # Usar resolución física de rutas"
        - "cd -P -e /tmp        # Usar resolución física de rutas y salir si hay error"
        - "cd -L /tmp           # Forzar el seguimiento de enlaces simbólicos (comportamiento predeterminado)"
        # - "cd -@ /tmp           # Mostrar atributos extendidos (si se admite)"
      notes: "Admite autocompletado con Tab y manejo de rutas con caracteres especiales. El comportamiento predeterminado sigue enlaces simbólicos (-L)."

    pushd:
      title: "📤 Apilar directorio"
      description: "Poner un directorio en la pila y cambiar a él"
      usage: "pushd [directory]"
      options:
        - ["directory", "Ruta del directorio de destino"]
        - ["(no args)", "Intercambiar los dos directorios superiores de la pila"]
      examples:
        - "pushd /tmp           # Poner el directorio actual en la pila e ir a /tmp"
        - "pushd                # Intercambiar entre el directorio actual y el anterior"
      notes: "Mantiene una pila de directorios para navegar con facilidad entre varios directorios."

    popd:
      title: "📥 Sacar directorio de la pila"
      description: "Extraer un directorio de la pila y cambiar a él"
      usage: "popd"
      options: []
      examples:
        - "popd                 # Volver al directorio anterior desde la pila"
      notes: "Elimina el directorio superior de la pila y cambia a él."

    dirs:
      title: "📋 Mostrar pila de directorios"
      description: "Mostrar la pila de directorios"
      usage: "dirs [-c]"
      options:
        - ["-c", "Borrar la pila de directorios"]
      examples:
        - "dirs                 # Mostrar la pila de directorios actual"
        - "dirs -c              # Borrar la pila de directorios"
      notes: "Muestra todos los directorios que están actualmente en la pila de navegación."

    help:
      title: "❓ Ayuda"
      description: "Mostrar los comandos y funciones disponibles"
      usage: "help"
      options: []
      examples:
        - "help                 # Mostrar información de ayuda general"
      notes: "Ofrece una visión general de todos los comandos y funciones disponibles del shell."

    clear:
      title: "🧹 Limpiar pantalla"
      description: "Limpiar la pantalla del terminal"
      usage: "clear"
      options: []
      examples:
        - "clear                # Limpiar la pantalla del terminal"
      notes: "Equivale al comando estándar clear de Unix."

    exit:
      title: "🚪 Salir del shell"
      description: "Salir de AI Shell"
      usage: "exit"
      options: []
      examples:
        - "exit                 # Salir del shell"
        - "quit                 # Forma alternativa de salir"
      notes: "Sale del shell limpiamente y conserva los datos de la sesión."

    export:
      title: "🔧 Exportar variables de entorno"
      description: "Establecer o mostrar variables de entorno con atributos de exportación"
      usage: "export [-fn] [name[=value] ...]\nexport -p"
      options:
        - ["-f", "El nombre hace referencia a una función del shell (no compatible)"]
        - ["-n", "Quitar el atributo de exportación de cada nombre"]
        - ["-p", "Mostrar la lista de todas las variables exportadas"]
        - ["--", "Desactivar el procesamiento posterior de opciones"]
      examples:
        - "export PATH=/usr/local/bin:$PATH"
        - "export EDITOR=vim"
        - "export -n VAR  # Quitar el atributo de exportación de VAR"
        - "export -p      # Mostrar todas las variables exportadas"
        - "export JAVA_HOME=\"/usr/lib/jvm/java-11-openjdk\""
        - "export -- -VAR  # Establecer una variable llamada -VAR"
      notes: "Las variables de entorno definidas con export se pasan a los procesos hijos."

    unset:
      title: "🗑️ Eliminar variables de entorno"
      description: "Eliminar variables y funciones del shell"
      usage: "unset [-f] [-v] [-n] [name ...]"
      options:
        - ["-f", "Cada nombre hace referencia a una función del shell (no compatible)"]
        - ["-v", "Cada nombre hace referencia a una variable del shell (predeterminado)"]
        - ["-n", "Cada nombre hace referencia a una referencia de nombre (no compatible)"]
        - ["--", "Desactivar el procesamiento posterior de opciones"]
      examples:
        - "unset TEMP_VAR"
        - "unset -v VAR1 VAR2"
        - "unset JAVA_HOME"
        - "unset -- -VAR  # Eliminar la variable llamada -VAR"
      notes: "Elimina variables del entorno del shell. Las variables que no existen se ignoran."

    pwd:
      title: "📍 Mostrar directorio de trabajo"
      description: "Mostrar el directorio de trabajo actual con manejo de enlaces simbólicos"
      usage: "pwd [-L|-P]"
      options:
        - ["-L", "Mostrar la ruta lógica (seguir enlaces simbólicos, predeterminado)"]
        - ["-P", "Mostrar la ruta física (resolver enlaces simbólicos)"]
      examples:
        - "pwd                  # Mostrar el directorio actual lógico"
        - "pwd -L               # Mostrar la ruta lógica (respetando enlaces simbólicos)"
        - "pwd -P               # Mostrar la ruta física (resolviendo enlaces simbólicos)"
      notes: "El comportamiento predeterminado muestra la ruta lógica que respeta los enlaces simbólicos."

    ";":
      title: "🤖 Asistente de IA"
      description: "Hacer una pregunta al asistente de IA"
      usage: "; <question>"
      options:
        - ["question", "Tu pregunta para el asistente de IA"]
      examples:
        - "; como encuentro archivos grandes?"
        - "; explica este comando: ls -la"
        - "; sugiere una mejor forma de comprimir archivos"
      notes: "El asistente de IA puede ayudar con explicaciones de comandos, sugerencias y uso general del shell."

    "；":
      title: "🤖 Asistente de IA"
      description: "Hacer una pregunta al asistente de IA"
      usage: "； <question>"
      options:
        - ["question", "Tu pregunta para el asistente de IA"]
      examples:
        - "； como encuentro archivos grandes?"
        - "； explica este comando: ls -la"
        - "； sugiere una mejor forma de comprimir archivos"
      notes: "El asistente de IA puede ayudar con explicaciones de comandos, sugerencias y uso general del shell."

    "/model":
      title: "🧠 Cambiar modelo"
      description: "Mostrar el modelo actual o cambiar a un modelo específico"
      usage: "/model [model]"
      options:
        - ["model", "Identificador del modelo de destino (validado para compatibilidad con llamadas a herramientas)"]
        - ["--help, -h", "Mostrar este mensaje de ayuda"]
      examples:
        - "/model               # Mostrar el modelo actual"
        - "/model gpt-4         # Cambiar a un modelo"
        - "/model --help        # Mostrar ayuda"
      notes: "El cambio valida la conectividad y la compatibilidad con llamadas a herramientas; si falla, se mantiene el modelo actual."

    "/setup":
      title: "⚙️ Reconfigurar"
      description: "Volver a ejecutar el asistente de configuración interactiva para cambiar los ajustes de la API (proveedor, clave API, modelo)"
      usage: "/setup"
      options:
        - ["--help, -h", "Mostrar este mensaje de ayuda"]
      examples:
        - "/setup               # Iniciar el asistente de configuración"
        - "/setup --help        # Mostrar ayuda"
      notes: "La nueva configuración se aplica de inmediato sin reiniciar. Si se cancela, se conserva la configuración actual."

errors:
  litellm_not_installed: "El modulo litellm no está instalado"