name: Resolve Release PR
description: Validate release PR context and emit merge ref checkout coordinates

inputs:
  pr_number:
    description: Pull request number to validate
    required: true
  repository:
    description: GitHub repository in owner/name form
    required: false
    default: ${{ github.repository }}

outputs:
  checkout_ref:
    description: Merge ref to checkout, for example refs/pull/123/merge
    value: ${{ steps.resolve.outputs.checkout_ref }}
  pr_number:
    description: Normalized pull request number
    value: ${{ steps.resolve.outputs.pr_number }}
  head_ref:
    description: Pull request head branch name
    value: ${{ steps.resolve.outputs.head_ref }}
  version:
    description: Version inferred from release/vX.Y.Z-prep when available
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - name: Validate release PR context
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
      run: |
        python3 packaging/scripts/resolve_release_pr.py \
          --pr-number "$INPUT_PR_NUMBER" \
          --repository "$INPUT_REPOSITORY" \
          --github-output "$GITHUB_OUTPUT"
