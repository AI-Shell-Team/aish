name: Release Preparation

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target release version, for example 0.3.0 or 1.0.0-beta.1"
        required: true
        type: string
      ref:
        description: "Git ref to validate, for example release/v0.3.0-prep or a commit SHA"
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-preparation-${{ github.event.inputs.version }}
  cancel-in-progress: true

jobs:
  release-meta:
    name: Compute release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      previous_stable_tag: ${{ steps.metadata.outputs.previous_stable_tag }}
      release_notes: ${{ steps.metadata.outputs.release_notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Compute release metadata
        id: metadata
        uses: ./.github/actions/release-metadata
        with:
          version: ${{ github.event.inputs.version }}
          artifact_prefix: release-preparation

  prepare-release:
    name: Summarize release preparation output
    needs: release-meta
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.release-meta.outputs.version }}
      tag: ${{ needs.release-meta.outputs.tag }}
      previous_stable_tag: ${{ needs.release-meta.outputs.previous_stable_tag }}
    steps:
      - name: Write job summary
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          # Release Preparation Ready

          - Version: ${{ needs.release-meta.outputs.version }}
          - Tag: ${{ needs.release-meta.outputs.tag }}
          - Ref: ${{ github.event.inputs.ref }}
          - Previous stable tag: ${{ needs.release-meta.outputs.previous_stable_tag || 'none' }}

          ## Release Notes

          ${{ needs.release-meta.outputs.release_notes }}
          EOF

  dry-run-package-validation:
    name: Dry-run package validation (${{ matrix.arch }})
    needs: release-meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runs_on: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up build environment
        env:
          AISH_BUILD_TARGET: ${{ matrix.target }}
        run: ./packaging/scripts/setup-ci-env.sh

      - name: Build bundle
        run: |
          VERSION="${{ needs.release-meta.outputs.version }}"
          OUTPUT_DIR="artifacts/${{ matrix.arch }}"
          VERSION="$VERSION" PLATFORM="linux" ARCH="${{ matrix.arch }}" AISH_BUILD_TARGET="${{ matrix.target }}" OUTPUT_DIR="$OUTPUT_DIR" ./packaging/build_bundle.sh
          ls -lah "$OUTPUT_DIR"

      - name: Smoke test bundle install
        run: |
          VERSION="${{ needs.release-meta.outputs.version }}"
          OUTPUT_DIR="artifacts/${{ matrix.arch }}"
          BUNDLE="aish-${VERSION}-linux-${{ matrix.arch }}"
          EXTRACT_DIR="$PWD/build/install-smoke/${{ matrix.arch }}"
          INSTALL_ROOT="$PWD/build/install-root/${{ matrix.arch }}"

          rm -rf "$EXTRACT_DIR" "$INSTALL_ROOT"
          mkdir -p "$EXTRACT_DIR" "$INSTALL_ROOT"

          tar -xzf "$OUTPUT_DIR/${BUNDLE}.tar.gz" -C "$EXTRACT_DIR"
          AISH_INSTALL_ROOT="$INSTALL_ROOT" AISH_SKIP_SYSTEMD=1 "$EXTRACT_DIR/${BUNDLE}/install.sh"

          test -x "$INSTALL_ROOT/usr/local/bin/aish"
          test -f "$INSTALL_ROOT/etc/aish/security_policy.yaml"
          test -f "$INSTALL_ROOT/etc/systemd/system/aish-sandbox.service"
          test -f "$INSTALL_ROOT/etc/systemd/system/aish-sandbox.socket"

      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-preparation-aish-linux-${{ matrix.arch }}
          path: artifacts/${{ matrix.arch }}/*
          if-no-files-found: error

  dry-run-pypi-validation:
    name: Dry-run PyPI validation (${{ matrix.arch }})
    needs: release-meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runs_on: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Skip PyPI validation for prerelease versions
        if: ${{ contains(needs.release-meta.outputs.version, '-') }}
        run: |
          echo "Skipping PyPI wheel validation for prerelease version ${{ needs.release-meta.outputs.version }}."

      - name: Checkout repository
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up build environment
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        env:
          AISH_BUILD_TARGET: ${{ matrix.target }}
        run: ./packaging/scripts/setup-ci-env.sh

      - name: Set up Python
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python build tooling
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        run: python -m pip install --upgrade pip build

      - name: Build PyPI wheel
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        run: |
          VERSION="${{ needs.release-meta.outputs.version }}"
          DIST_DIR="$PWD/artifacts/pypi/${{ matrix.arch }}"
          VERSION="$VERSION" DIST_DIR="$DIST_DIR" AISH_PYPI_REPOSITORY_LABEL="PyPI" AISH_BUILD_TARGET="${{ matrix.target }}" ./packaging/scripts/build_testpypi_package.sh
          ls -lah "$DIST_DIR"

      - name: Smoke test wheel install
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        shell: bash
        run: |
          DIST_DIR="$PWD/artifacts/pypi/${{ matrix.arch }}"
          VENV_DIR="$PWD/build/pypi-smoke/${{ matrix.arch }}"

          rm -rf "$VENV_DIR"
          python -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"

          python -m pip install --upgrade pip
          python -m pip install "$DIST_DIR"/aish_rust-*.whl
          aish --version >/dev/null
          python -m pip uninstall -y aish-rust

      - name: Upload PyPI dry-run artifacts
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        uses: actions/upload-artifact@v6
        with:
          name: release-preparation-pypi-linux-${{ matrix.arch }}
          path: artifacts/pypi/${{ matrix.arch }}/*
          if-no-files-found: error

  live-smoke-validation:
    name: Live smoke validation
    needs:
      - release-meta
      - dry-run-package-validation
    uses: ./.github/workflows/live-smoke.yml
    with:
      ref: ${{ github.event.inputs.ref }}
    secrets: inherit

  release-preparation-summary:
    name: Summarize release preparation validation
    needs:
      - release-meta
      - prepare-release
      - dry-run-package-validation
      - dry-run-pypi-validation
      - live-smoke-validation
    runs-on: ubuntu-latest
    steps:
      - name: Write final summary
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          # Release Preparation Complete

          - Version: ${{ needs.release-meta.outputs.version }}
          - Tag: ${{ needs.release-meta.outputs.tag }}
          - Ref: ${{ github.event.inputs.ref }}
          - Previous stable tag: ${{ needs.release-meta.outputs.previous_stable_tag || 'none' }}

          Release metadata artifacts, dry-run bundle validation, stable-only PyPI wheel validation, and live smoke validation have completed successfully.
          EOF
