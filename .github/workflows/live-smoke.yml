name: Live Smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        default: main
        type: string
      suite:
        description: Live smoke suite to run
        required: false
        default: blocking
        type: choice
        options:
          - blocking
          - extended
          - all
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        type: string
        default: main
      suite:
        description: Live smoke suite to run
        required: false
        type: string
        default: blocking

concurrency:
  group: "live-smoke-${{ github.workflow }}-${{ inputs.ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  live-smoke:
    name: Run live smoke tests
    runs-on: ubuntu-latest
    environment:
      name: live-smoke

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Read pinned Rust toolchain
        id: rust_toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          targets: x86_64-unknown-linux-musl

      - name: Install live smoke runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools bubblewrap util-linux

      - name: Validate live smoke secrets
        env:
          AISH_LIVE_SMOKE_API_KEY: ${{ secrets.AISH_LIVE_SMOKE_API_KEY }}
          AISH_LIVE_SMOKE_MODEL: ${{ secrets.AISH_LIVE_SMOKE_MODEL }}
        run: |
          set -euo pipefail

          if [[ -z "${AISH_LIVE_SMOKE_MODEL}" ]]; then
            echo "Missing required secret: AISH_LIVE_SMOKE_MODEL" >&2
            exit 1
          fi

          if [[ -z "${AISH_LIVE_SMOKE_API_KEY}" ]]; then
            echo "Missing required secret: AISH_LIVE_SMOKE_API_KEY" >&2
            exit 1
          fi

      - name: Build and install live smoke bundle
        run: |
          set -euo pipefail
          VERSION="0.0.0+${GITHUB_SHA::8}"
          OUTPUT_DIR="$PWD/build/live-smoke-artifacts"
          EXTRACT_DIR="$PWD/build/live-smoke-extract"
          INSTALL_ROOT="$PWD/build/live-smoke-install-root"
          BUNDLE="aish-${VERSION}-linux-amd64"

          rm -rf "$OUTPUT_DIR" "$EXTRACT_DIR" "$INSTALL_ROOT"
          mkdir -p "$OUTPUT_DIR"

          cargo build --release --target x86_64-unknown-linux-musl
          VERSION="$VERSION" PLATFORM="linux" ARCH="amd64" AISH_BUILD_TARGET="x86_64-unknown-linux-musl" OUTPUT_DIR="$OUTPUT_DIR" ./packaging/build_bundle.sh
          mkdir -p "$EXTRACT_DIR" "$INSTALL_ROOT"
          tar -xzf "$OUTPUT_DIR/${BUNDLE}.tar.gz" -C "$EXTRACT_DIR"
          AISH_INSTALL_ROOT="$INSTALL_ROOT" AISH_SKIP_SYSTEMD=1 "$EXTRACT_DIR/${BUNDLE}/install.sh"
          test -x "$INSTALL_ROOT/usr/local/bin/aish"
          echo "AISH_LIVE_SMOKE_EXECUTABLE=$INSTALL_ROOT/usr/local/bin/aish" >> "$GITHUB_ENV"

      - name: Smoke test installed binary
        run: |
          set -euo pipefail
          "$AISH_LIVE_SMOKE_EXECUTABLE" --help >/dev/null

      - name: Run live tool-call check
        env:
          AISH_LIVE_SMOKE_API_BASE: ${{ secrets.AISH_LIVE_SMOKE_API_BASE }}
          AISH_LIVE_SMOKE_API_KEY: ${{ secrets.AISH_LIVE_SMOKE_API_KEY }}
          AISH_LIVE_SMOKE_MODEL: ${{ secrets.AISH_LIVE_SMOKE_MODEL }}
        run: |
          set -euo pipefail
          mkdir -p build/live-smoke
          args=(check-tool-support --model "$AISH_LIVE_SMOKE_MODEL" --api-key "$AISH_LIVE_SMOKE_API_KEY")
          if [[ -n "${AISH_LIVE_SMOKE_API_BASE:-}" ]]; then
            args+=(--api-base "$AISH_LIVE_SMOKE_API_BASE")
          fi
          "$AISH_LIVE_SMOKE_EXECUTABLE" "${args[@]}" | tee build/live-smoke/check-tool-support.txt
          grep -q "Tool calling is supported" build/live-smoke/check-tool-support.txt

      - name: Upload live smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-smoke-diagnostics-${{ github.run_id }}
          path: build/live-smoke/**
          if-no-files-found: ignore

      - name: Write workflow summary
        if: always()
        env:
          LIVE_MODEL: ${{ secrets.AISH_LIVE_SMOKE_MODEL }}
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          # Live Smoke Summary

          - Ref: ${{ inputs.ref || github.sha }}
          - Suite: ${{ inputs.suite || 'blocking' }}
          - Model: ${LIVE_MODEL:-<missing>}
          - Executable: ${AISH_LIVE_SMOKE_EXECUTABLE:-<missing>}
          - Diagnostics artifact: live-smoke-diagnostics-${{ github.run_id }}

          This workflow validates the installed Rust bundle and runs a live provider tool-call check with credentials from the protected \`live-smoke\` environment.
          EOF