name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-meta:
    name: Compute release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      previous_stable_tag: ${{ steps.metadata.outputs.previous_stable_tag }}
      release_notes: ${{ steps.metadata.outputs.release_notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag commit is on main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Compute release metadata
        id: metadata
        uses: ./.github/actions/release-metadata
        with:
          version: ${{ github.ref_name }}
          artifact_prefix: release

  release-gate:
    name: Release boundary checkpoint
    needs: release-meta
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Confirm release payload
        run: |
          echo "Release ${RELEASE_TAG} is ready for bundle and PyPI publishing."
        env:
          RELEASE_TAG: ${{ needs.release-meta.outputs.tag }}

  create-release:
    name: Create GitHub release
    needs:
      - release-meta
      - release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Create release entry with changelog notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          name: aish ${{ needs.release-meta.outputs.tag }}
          body: ${{ needs.release-meta.outputs.release_notes }}
          prerelease: ${{ contains(needs.release-meta.outputs.version, '-') }}

  build-release-packages:
    name: Build release bundle (${{ matrix.arch }})
    needs:
      - release-meta
      - release-gate
      - create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runs_on: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up build environment
        env:
          AISH_BUILD_TARGET: ${{ matrix.target }}
        run: ./packaging/scripts/setup-ci-env.sh

      - name: Build release bundle
        run: |
          VERSION="${{ needs.release-meta.outputs.version }}"
          OUTPUT_DIR="artifacts/${{ matrix.arch }}"
          VERSION="$VERSION" PLATFORM="linux" ARCH="${{ matrix.arch }}" AISH_BUILD_TARGET="${{ matrix.target }}" OUTPUT_DIR="$OUTPUT_DIR" ./packaging/build_bundle.sh
          ls -lah "$OUTPUT_DIR"

      - name: Smoke test bundle install
        run: |
          VERSION="${{ needs.release-meta.outputs.version }}"
          OUTPUT_DIR="artifacts/${{ matrix.arch }}"
          BUNDLE="aish-${VERSION}-linux-${{ matrix.arch }}"
          EXTRACT_DIR="$PWD/build/install-smoke/${{ matrix.arch }}"
          INSTALL_ROOT="$PWD/build/install-root/${{ matrix.arch }}"

          rm -rf "$EXTRACT_DIR" "$INSTALL_ROOT"
          mkdir -p "$EXTRACT_DIR" "$INSTALL_ROOT"

          tar -xzf "$OUTPUT_DIR/${BUNDLE}.tar.gz" -C "$EXTRACT_DIR"
          AISH_INSTALL_ROOT="$INSTALL_ROOT" AISH_SKIP_SYSTEMD=1 "$EXTRACT_DIR/${BUNDLE}/install.sh"

          test -x "$INSTALL_ROOT/usr/local/bin/aish"
          test -f "$INSTALL_ROOT/etc/aish/security_policy.yaml"
          test -f "$INSTALL_ROOT/etc/systemd/system/aish-sandbox.service"
          test -f "$INSTALL_ROOT/etc/systemd/system/aish-sandbox.socket"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-bundle-linux-${{ matrix.arch }}
          path: artifacts/${{ matrix.arch }}/*
          if-no-files-found: error

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          prerelease: ${{ contains(needs.release-meta.outputs.version, '-') }}
          files: artifacts/${{ matrix.arch }}/*

  publish-release-bundles:
    name: Publish release bundles
    needs:
      - release-meta
      - release-gate
      - build-release-packages
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.release-meta.outputs.version }}
      ARTIFACT_ROOT: artifacts/release
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
      DOWNLOAD_PREFIX: ${{ contains(needs.release-meta.outputs.version, '-') && 'download/beta' || 'download' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: release-bundle-linux-*
          path: ${{ env.ARTIFACT_ROOT }}

      - name: Ensure aws CLI is available
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y awscli
          fi
          aws --version

      - name: Publish release bundles
        run: bash ./packaging/scripts/publish_release.sh

  build-pypi-wheels:
    name: Build PyPI wheel (${{ matrix.arch }})
    needs:
      - release-meta
      - release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Read pinned Rust toolchain
        id: rust_toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install wheel build dependencies
        run: python -m pip install --upgrade pip maturin

      - name: Build PyPI wheel
        run: |
          OUTPUT_DIR="$PWD/artifacts/pypi/${{ matrix.arch }}"
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          python -m maturin build --release --compatibility pypi --out "$OUTPUT_DIR"
          ls -lah "$OUTPUT_DIR"

      - name: Smoke test wheel install
        run: |
          VENV_DIR="$PWD/build/pypi-wheel-smoke/${{ matrix.arch }}"
          WHEEL_DIR="$PWD/artifacts/pypi/${{ matrix.arch }}"
          rm -rf "$VENV_DIR"
          python -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/python" -m pip install "$WHEEL_DIR"/*.whl
          "$VENV_DIR/bin/aish" --version

      - name: Upload PyPI wheel artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pypi-wheel-linux-${{ matrix.arch }}
          path: artifacts/pypi/${{ matrix.arch }}/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish PyPI wheels
    needs:
      - release-meta
      - release-gate
      - build-pypi-wheels
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download PyPI wheel artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: pypi-wheel-linux-*
          path: artifacts/pypi

      - name: Collect wheels
        run: |
          mkdir -p dist/pypi
          find artifacts/pypi -type f -name '*.whl' -exec cp {} dist/pypi/ \;
          ls -lah dist/pypi

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/pypi
          skip-existing: true

  release-summary:
    name: Summarize published release
    needs:
      - release-meta
      - create-release
      - build-release-packages
      - publish-release-bundles
      - build-pypi-wheels
      - publish-pypi
    runs-on: ubuntu-latest
    steps:
      - name: Write job summary
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          # Release Assets Published

          - Version: ${{ needs.release-meta.outputs.version }}
          - Tag: ${{ needs.release-meta.outputs.tag }}

          GitHub Release metadata was generated from the tag push, bundle assets were uploaded successfully, the CDN channel was updated, and amd64/arm64 wheel artifacts were published to PyPI.
          EOF
