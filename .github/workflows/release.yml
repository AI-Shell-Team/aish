name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-meta:
    name: Compute release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      previous_stable_tag: ${{ steps.metadata.outputs.previous_stable_tag }}
      release_notes: ${{ steps.metadata.outputs.release_notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag commit is on main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Compute release metadata
        id: metadata
        uses: ./.github/actions/release-metadata
        with:
          version: ${{ github.ref_name }}
          artifact_prefix: release

  create-release:
    name: Create GitHub release
    needs:
      - release-meta
    runs-on: ubuntu-latest
    steps:
      - name: Create release entry with changelog notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          name: aish ${{ needs.release-meta.outputs.tag }}
          body: ${{ needs.release-meta.outputs.release_notes }}
          prerelease: ${{ contains(needs.release-meta.outputs.version, '-') }}

  build-release-packages:
    name: Build release bundle (${{ matrix.arch }})
    needs:
      - release-meta
      - create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runs_on: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up build environment
        env:
          AISH_BUILD_TARGET: ${{ matrix.target }}
        run: ./packaging/scripts/setup-ci-env.sh

      - name: Build release bundle
        run: |
          VERSION="${{ needs.release-meta.outputs.version }}"
          OUTPUT_DIR="artifacts/${{ matrix.arch }}"
          VERSION="$VERSION" PLATFORM="linux" ARCH="${{ matrix.arch }}" AISH_BUILD_TARGET="${{ matrix.target }}" OUTPUT_DIR="$OUTPUT_DIR" ./packaging/build_bundle.sh
          ls -lah "$OUTPUT_DIR"

      - name: Smoke test bundle install
        run: |
          VERSION="${{ needs.release-meta.outputs.version }}"
          OUTPUT_DIR="artifacts/${{ matrix.arch }}"
          BUNDLE="aish-${VERSION}-linux-${{ matrix.arch }}"
          EXTRACT_DIR="$PWD/build/install-smoke/${{ matrix.arch }}"
          INSTALL_ROOT="$PWD/build/install-root/${{ matrix.arch }}"

          rm -rf "$EXTRACT_DIR" "$INSTALL_ROOT"
          mkdir -p "$EXTRACT_DIR" "$INSTALL_ROOT"

          tar -xzf "$OUTPUT_DIR/${BUNDLE}.tar.gz" -C "$EXTRACT_DIR"
          AISH_INSTALL_ROOT="$INSTALL_ROOT" AISH_SKIP_SYSTEMD=1 "$EXTRACT_DIR/${BUNDLE}/install.sh"

          test -x "$INSTALL_ROOT/usr/local/bin/aish"
          test -f "$INSTALL_ROOT/etc/systemd/system/aish-sandbox.service"
          test -f "$INSTALL_ROOT/etc/systemd/system/aish-sandbox.socket"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-bundle-linux-${{ matrix.arch }}
          path: artifacts/${{ matrix.arch }}/*
          if-no-files-found: error

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          prerelease: ${{ contains(needs.release-meta.outputs.version, '-') }}
          files: artifacts/${{ matrix.arch }}/*

  build-pypi-packages:
    name: Build PyPI package (${{ matrix.arch }})
    needs:
      - release-meta
      - create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runs_on: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Skip PyPI package build for prerelease versions
        if: ${{ contains(needs.release-meta.outputs.version, '-') }}
        run: |
          echo "Skipping PyPI package build for prerelease version ${{ needs.release-meta.outputs.version }}."

      - name: Checkout repository
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        uses: actions/checkout@v6

      - name: Set up build environment
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        env:
          AISH_BUILD_TARGET: ${{ matrix.target }}
        run: ./packaging/scripts/setup-ci-env.sh

      - name: Set up Python
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python build tooling
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        run: python -m pip install --upgrade pip build

      - name: Build PyPI wheel
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        run: |
          VERSION="${{ needs.release-meta.outputs.version }}"
          DIST_DIR="$PWD/artifacts/pypi/${{ matrix.arch }}"
          VERSION="$VERSION" DIST_DIR="$DIST_DIR" AISH_PYPI_REPOSITORY_LABEL="PyPI" AISH_BUILD_TARGET="${{ matrix.target }}" ./packaging/scripts/build_testpypi_package.sh
          ls -lah "$DIST_DIR"

      - name: Smoke test wheel install
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        shell: bash
        run: |
          DIST_DIR="$PWD/artifacts/pypi/${{ matrix.arch }}"
          VENV_DIR="$PWD/build/pypi-release-smoke/${{ matrix.arch }}"

          rm -rf "$VENV_DIR"
          python -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"

          python -m pip install --upgrade pip
          python -m pip install "$DIST_DIR"/aish_rust-*.whl
          aish --version >/dev/null
          python -m pip uninstall -y aish-rust

      - name: Upload PyPI artifacts
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        uses: actions/upload-artifact@v6
        with:
          name: release-pypi-linux-${{ matrix.arch }}
          path: artifacts/pypi/${{ matrix.arch }}/*
          if-no-files-found: error

  publish-release:
    name: Publish release
    needs:
      - release-meta
      - build-release-packages
      - build-pypi-packages
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release-meta.outputs.version }}
      # CDN/R2 publishing is disabled because the CDN is unavailable.
      # Re-enable these (and the matching steps below) once the CDN is back.
      # ARTIFACT_ROOT: artifacts/release
      # R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      # AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      # AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # AWS_DEFAULT_REGION: auto
      # CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
      # DOWNLOAD_PREFIX: ${{ contains(needs.release-meta.outputs.version, '-') && 'download/beta' || 'download' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # CDN/R2 publishing is disabled because the CDN is unavailable.
      # Re-enable these steps once the CDN is back.
      # - name: Download release artifacts
      #   uses: actions/download-artifact@v6
      #   with:
      #     pattern: release-bundle-linux-*
      #     path: ${{ env.ARTIFACT_ROOT }}
      #
      # - name: Ensure aws CLI is available
      #   run: |
      #     if ! command -v aws >/dev/null 2>&1; then
      #       sudo apt-get update
      #       sudo apt-get install -y awscli
      #     fi
      #     aws --version
      #
      # - name: Publish release bundles
      #   run: bash ./packaging/scripts/publish_release.sh

      - name: Skip PyPI publish for prerelease versions
        if: ${{ contains(needs.release-meta.outputs.version, '-') }}
        run: |
          echo "Skipping PyPI publish for prerelease version ${{ needs.release-meta.outputs.version }}."

      - name: Download PyPI artifacts
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        uses: actions/download-artifact@v6
        with:
          pattern: release-pypi-linux-*
          path: artifacts/pypi

      - name: Prepare upload directory
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        shell: bash
        run: |
          UPLOAD_DIR="$PWD/dist/pypi-upload"
          rm -rf "$UPLOAD_DIR"
          mkdir -p "$UPLOAD_DIR"
          find "$PWD/artifacts/pypi" -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} "$UPLOAD_DIR"/ \;
          ls -lah "$UPLOAD_DIR"

      - name: Publish package to PyPI
        if: ${{ !contains(needs.release-meta.outputs.version, '-') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi-upload
          skip-existing: true

  publish-website:
    name: Publish bundles to official website
    needs:
      - release-meta
      - build-release-packages
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release-meta.outputs.version }}
      ARTIFACT_ROOT: artifacts/release
      WEBSITE_SSH_HOST: ${{ secrets.WEBSITE_SSH_HOST }}
      WEBSITE_SSH_USER: ${{ secrets.WEBSITE_SSH_USER }}
      WEBSITE_SSH_PORT: ${{ vars.WEBSITE_SSH_PORT || '22' }}
      WEBSITE_REPO_ROOT: ${{ vars.WEBSITE_REPO_ROOT }}
      WEBSITE_SITE_BASE_URL: ${{ vars.WEBSITE_SITE_BASE_URL || 'https://www.aishell.ai/repo' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate website publish configuration
        run: |
          missing=()
          for name in WEBSITE_SSH_HOST WEBSITE_SSH_USER WEBSITE_REPO_ROOT; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error::Missing website publish configuration: ${missing[*]}"
            echo "Configure WEBSITE_SSH_HOST and WEBSITE_SSH_USER as release environment secrets, and WEBSITE_REPO_ROOT as a repository variable." >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: release-bundle-linux-*
          path: ${{ env.ARTIFACT_ROOT }}

      - name: Configure SSH
        env:
          WEBSITE_SSH_PRIVATE_KEY: ${{ secrets.WEBSITE_SSH_PRIVATE_KEY }}
          WEBSITE_SSH_KNOWN_HOSTS: ${{ secrets.WEBSITE_SSH_KNOWN_HOSTS }}
        run: |
          if [[ -z "${WEBSITE_SSH_PRIVATE_KEY}" || -z "${WEBSITE_SSH_KNOWN_HOSTS}" ]]; then
            echo "::error::WEBSITE_SSH_PRIVATE_KEY and WEBSITE_SSH_KNOWN_HOSTS must be configured as release environment secrets."
            exit 1
          fi

          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$WEBSITE_SSH_PRIVATE_KEY" > "$HOME/.ssh/aishell_website"
          printf '%s\n' "$WEBSITE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/aishell_website_known_hosts"
          chmod 0600 "$HOME/.ssh/aishell_website" "$HOME/.ssh/aishell_website_known_hosts"

          ssh -i "$HOME/.ssh/aishell_website" \
            -p "${WEBSITE_SSH_PORT}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/aishell_website_known_hosts" \
            "${WEBSITE_SSH_USER}@${WEBSITE_SSH_HOST}" true

      - name: Publish bundles
        run: ./packaging/scripts/publish_website.sh

  release-summary:
    name: Summarize published release
    needs:
      - release-meta
      - create-release
      - build-release-packages
      - build-pypi-packages
      - publish-release
      - publish-website
    runs-on: ubuntu-latest
    steps:
      - name: Write job summary
        env:
          RELEASE_VERSION: ${{ needs.release-meta.outputs.version }}
          RELEASE_TAG: ${{ needs.release-meta.outputs.tag }}
        run: |
          {
            echo "# Release Assets Published"
            echo
            echo "- Version: ${RELEASE_VERSION}"
            echo "- Tag: ${RELEASE_TAG}"
            echo
            if [[ "${RELEASE_VERSION}" == *-* ]]; then
              echo "GitHub Release metadata was generated from the tag push, bundle assets were uploaded to GitHub Releases and the official website, and PyPI publishing was skipped for this prerelease. (CDN publishing is disabled.)"
            else
              echo "GitHub Release metadata was generated from the tag push, bundle assets were uploaded to GitHub Releases and the official website, and the package was published to PyPI via Trusted Publishing. (CDN publishing is disabled.)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
