name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - rust
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  CACHE_KEY_SUFFIX: v1

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      code: ${{ github.event_name == 'pull_request' && steps.filter.outputs.code || steps.default.outputs.code }}
      packaging: ${{ github.event_name == 'pull_request' && steps.filter.outputs.packaging || steps.default.outputs.packaging }}
    steps:
      - name: Default to full validation outside PRs
        id: default
        if: github.event_name != 'pull_request'
        run: |
          echo "code=true" >> "$GITHUB_OUTPUT"
          echo "packaging=true" >> "$GITHUB_OUTPUT"

      - name: Classify pull request changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            packaging:
              - 'packaging/**'
              - 'config/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/release-preparation.yml'

  lint-test:
    name: Lint and test
    needs: changes
    runs-on: ubuntu-latest

    steps:
      # Required status check "Lint and test" must always report success on PRs.
      # Docs/skills-only changes skip the heavy Rust work below.
      - name: Skip heavy checks for non-code PRs
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
            || [ "${{ needs.changes.outputs.code }}" = "true" ] \
            || [ "${{ needs.changes.outputs.packaging }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No code/packaging changes; marking Lint and test as passed."
          fi

      - name: Checkout repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Read pinned Rust toolchain
        id: rust_toolchain
        if: steps.gate.outputs.run == 'true'
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          components: clippy,rustfmt

      - name: Cache Cargo registry
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ env.CACHE_KEY_SUFFIX }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.CACHE_KEY_SUFFIX }}-

      - name: Check formatting
        if: steps.gate.outputs.run == 'true'
        run: make format-check

      - name: Run clippy
        if: steps.gate.outputs.run == 'true'
        run: make lint

      - name: Run tests
        if: steps.gate.outputs.run == 'true'
        run: cargo test --workspace

      - name: Run packaging release script smoke tests
        if: steps.gate.outputs.run == 'true'
        run: |
          ./packaging/tests/release_scripts_smoke.sh
          ./packaging/tests/seed_skills_ownership_smoke.sh

      - name: Install musl tools
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y musl-tools && rustup target add x86_64-unknown-linux-musl --toolchain "${{ steps.rust_toolchain.outputs.channel }}"

      - name: Build release binary (musl)
        if: steps.gate.outputs.run == 'true'
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Smoke test binary
        if: steps.gate.outputs.run == 'true'
        run: ./target/x86_64-unknown-linux-musl/release/aish --help

      - name: Upload release binary
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: aish-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/aish
          if-no-files-found: error

  build-bundle:
    name: Build bundle
    if: github.event_name != 'pull_request' || needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read pinned Rust toolchain
        id: rust_toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-musl-cargo-${{ env.CACHE_KEY_SUFFIX }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-musl-cargo-${{ env.CACHE_KEY_SUFFIX }}-

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Build bundle archive
        run: |
          VERSION="0.0.0+${GITHUB_SHA::8}"
          OUTPUT_DIR="artifacts/amd64"
          VERSION="$VERSION" PLATFORM="linux" ARCH="amd64" OUTPUT_DIR="$OUTPUT_DIR" ./packaging/build_bundle.sh

      - name: Smoke test binary
        run: ./target/x86_64-unknown-linux-musl/release/aish --help

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v6
        with:
          name: aish-linux-amd64-bundle
          path: |
            artifacts/amd64/*
          if-no-files-found: error
