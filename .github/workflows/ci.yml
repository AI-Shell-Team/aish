name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - rust
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  CACHE_KEY_SUFFIX: v1

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name == 'pull_request' && steps.filter.outputs.code || steps.default.outputs.code }}
      packaging: ${{ github.event_name == 'pull_request' && steps.filter.outputs.packaging || steps.default.outputs.packaging }}
    steps:
      - name: Default to full validation outside PRs
        id: default
        if: github.event_name != 'pull_request'
        run: |
          echo "code=true" >> "$GITHUB_OUTPUT"
          echo "packaging=true" >> "$GITHUB_OUTPUT"

      - name: Classify pull request changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            packaging:
              - 'packaging/**'
              - 'config/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/release-preparation.yml'

  lint:
    name: Lint
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' || needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read pinned Rust toolchain
        id: rust_toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          components: clippy,rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.CACHE_KEY_SUFFIX }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ env.CACHE_KEY_SUFFIX }}-

      - name: Check formatting
        run: make format-check

      - name: Run clippy
        run: make lint

  test:
    name: Test (${{ matrix.arch }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' || needs.changes.outputs.packaging == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read pinned Rust toolchain
        id: rust_toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ env.CACHE_KEY_SUFFIX }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ env.CACHE_KEY_SUFFIX }}-

      - name: Run tests
        run: cargo test --workspace

  packaging_smoke:
    name: Packaging smoke
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' || needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run packaging release script smoke tests
        run: |
          ./packaging/tests/release_scripts_smoke.sh
          ./packaging/tests/seed_skills_ownership_smoke.sh

  build_smoke:
    name: Build smoke (AMD64)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' || needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read pinned Rust toolchain
        id: rust_toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-musl-cargo-${{ env.CACHE_KEY_SUFFIX }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-musl-cargo-${{ env.CACHE_KEY_SUFFIX }}-

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Smoke test binary
        run: ./target/x86_64-unknown-linux-musl/release/aish --help

      - name: Upload release binary
        uses: actions/upload-artifact@v6
        with:
          name: aish-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/aish
          if-no-files-found: error

  lint-test:
    name: Lint and test
    if: always()
    needs:
      - changes
      - lint
      - test
      - packaging_smoke
      - build_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required CI jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGING_RESULT: ${{ needs.packaging_smoke.result }}
          BUILD_RESULT: ${{ needs.build_smoke.result }}
        run: |
          for result in \
            "$CHANGES_RESULT" \
            "$LINT_RESULT" \
            "$TEST_RESULT" \
            "$PACKAGING_RESULT" \
            "$BUILD_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Required CI job finished with result: $result"; exit 1 ;;
            esac
          done

  build-bundle:
    name: Build bundle
    if: github.event_name != 'pull_request' || needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - changes
      - lint-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read pinned Rust toolchain
        id: rust_toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-musl-cargo-${{ env.CACHE_KEY_SUFFIX }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-musl-cargo-${{ env.CACHE_KEY_SUFFIX }}-

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Build bundle archive
        run: |
          VERSION="0.0.0+${GITHUB_SHA::8}"
          OUTPUT_DIR="artifacts/amd64"
          VERSION="$VERSION" PLATFORM="linux" ARCH="amd64" OUTPUT_DIR="$OUTPUT_DIR" ./packaging/build_bundle.sh

      - name: Smoke test binary
        run: ./target/x86_64-unknown-linux-musl/release/aish --help

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v6
        with:
          name: aish-linux-amd64-bundle
          path: |
            artifacts/amd64/*
          if-no-files-found: error
