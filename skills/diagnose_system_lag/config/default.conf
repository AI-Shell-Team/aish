# diagnose_system_lag 配置文件
# 版本: 2.0.0

# ============================================
# CPU 诊断阈值
# ============================================

# CPU 负载阈值系数（负载超过 核心数 * 系数 视为过载）
CPU_THRESHOLD_FACTOR=1.5

# CPU 空闲率低于此值视为 CPU 瓶颈（%）
CPU_IDLE_CRITICAL=20

# CPU 空闲率高于此值但负载高视为 I/O 瓶颈（%）
CPU_IDLE_HIGH=60

# CPU iowait 超过此值视为磁盘 I/O 瓶颈（%）
CPU_IOWAIT_THRESHOLD=5

# ============================================
# 内存诊断阈值
# ============================================

# 可用内存低于此百分比视为内存紧张（%）
MEMORY_AVAILABLE_PERCENT=20

# 可用内存低于此数值视为内存紧张（GB）
MEMORY_AVAILABLE_GB=2

# Swap 使用超过此百分比视为严重（%）
SWAP_USED_PERCENT=50

# Swap 使用超过此数值视为严重（GB）
SWAP_USED_GB=2

# ============================================
# 磁盘诊断阈值
# ============================================

# 磁盘使用率超过此值发出警告（%）
DISK_WARNING_PERCENT=90

# 磁盘使用率超过此值发出严重警告（%）
DISK_CRITICAL_PERCENT=95

# ============================================
# 报告设置
# ============================================

# 报告保留天数（天）
REPORT_RETENTION_DAYS=30

# 日志保留天数（天）
LOG_RETENTION_DAYS=7

# 是否启用彩色输出
ENABLE_COLOR_OUTPUT=true

# 报告输出格式（text, json, markdown）
REPORT_FORMAT=text

# ============================================
# 进程分析设置
# ============================================

# 显示 TOP 进程数量
TOP_PROCESS_COUNT=25

# 是否自动识别应用类型
ENABLE_PROCESS_RECOGNITION=true

# 是否过滤系统服务
FILTER_SYSTEM_SERVICES=true
