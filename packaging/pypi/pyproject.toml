[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aish-rust"
dynamic = ["version"]
description = "AI Shell command-line interface"
readme = "README_PYPI.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "AI Shell Team" }
]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/AI-Shell-Team/aish"
Repository = "https://github.com/AI-Shell-Team/aish"
Issues = "https://github.com/AI-Shell-Team/aish/issues"

[project.scripts]
aish = "aish_rust.launcher:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aish_rust = ["bin/aish"]

[tool.setuptools.dynamic]
version = { attr = "aish_rust._version.__version__" }