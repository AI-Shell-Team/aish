help:
  labels:
    usage: "Utilisation"
    options: "Options"
    examples: "Exemples"
    notes: "Notes"
    brief_usage: "Utilisation : {usage}"

  general:
    title: "Aide AI Shell"
    markdown: |-
      ## Commandes disponibles :

      ### Commandes generales
      - `help` - Afficher cette aide
      - `clear` - Effacer l'ecran
      - `exit` - Quitter le shell
      - `/model [modele]` - Afficher ou changer de modele
      - `/setup` - Reconfigurer les parametres API

      ### Commandes IA
      - `; <question>` - Poser une question a l'assistant IA

      ### Obtenir de l'aide
      Utilisez `<commande> --help` ou `<commande> -h` pour afficher l'aide detaillee d'une commande.