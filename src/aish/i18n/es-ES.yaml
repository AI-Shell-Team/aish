    usage: "Uso"
    options: "Opciones"
    examples: "Ejemplos"
    notes: "Notas"
    brief_usage: "Uso: {usage}"

  general:
    title: "Ayuda de AI Shell"
    markdown: |-
      ## Comandos disponibles:

      ### Comandos generales
      - `help` - Mostrar esta ayuda
      - `clear` - Limpiar la pantalla
      - `exit` - Salir de la shell
      - `/model [modelo]` - Mostrar o cambiar el modelo
      - `/setup` - Reconfigurar los ajustes de API

      ### Comandos de IA
      - `; <pregunta>` - Hacer una pregunta al asistente de IA

      ### Obtener ayuda
      Use `<comando> --help` o `<comando> -h` para ver la ayuda detallada de cualquier comando.