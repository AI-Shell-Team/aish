help:
  labels:
    usage: "Verwendung"
    options: "Optionen"
    examples: "Beispiele"
    notes: "Hinweise"
    brief_usage: "Verwendung: {usage}"

  general:
    title: "AI Shell Hilfe"
    markdown: |-
      ## Verfuegbare Befehle:

      ### Allgemeine Befehle
      - `help` - Diese Hilfe anzeigen
      - `clear` - Bildschirm leeren
      - `exit` - Shell beenden
      - `/model [Modell]` - Modell anzeigen oder wechseln
      - `/setup` - API-Einstellungen erneut konfigurieren

      ### KI-Befehle
      - `; <Frage>` - Dem KI-Assistenten eine Frage stellen

      ### Weitere Hilfe
      Verwenden Sie `<Befehl> --help` oder `<Befehl> -h`, um Detailhilfe fuer einen Befehl anzuzeigen.