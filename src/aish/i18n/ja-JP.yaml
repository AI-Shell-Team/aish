help:
  labels:
    usage: "使い方"
    options: "オプション"
    examples: "例"
    notes: "補足"
    brief_usage: "使い方: {usage}"

  general:
    title: "AI Shell ヘルプ"
    markdown: |-
      ## 利用可能なコマンド:

      ### 一般コマンド
      - `help` - このヘルプを表示します
      - `clear` - 画面を消去します
      - `exit` - シェルを終了します
      - `/model [model]` - モデルを表示または切り替えます
      - `/setup` - API 設定を再構成します

      ### AI コマンド
      - `; <質問>` - AI アシスタントに質問します

      ### ヘルプの表示
      各コマンドの詳細は `<command> --help` または `<command> -h` を使用してください。